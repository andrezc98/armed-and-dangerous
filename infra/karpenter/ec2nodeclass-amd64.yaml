# One EC2NodeClass per architecture, referenced by the NodePool of the same
# architecture in nodepool.yaml. The bottlerocket@latest alias resolves the AMI
# per architecture on its own, so the split is not about booting: it is about
# every arc node carrying the right aad/arch tag in the bill.
#
# The karpenter.sh/discovery value is var.cluster_name (default
# aws-aad-eks-lab), which is why variables.tf refuses any other cluster name
# until these two files are edited.
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: aad-bottlerocket-amd64
spec:
  # Created by the karpenter submodule with node_iam_role_use_name_prefix=false.
  role: aws-aad-karpenter-node
  amiSelectorTerms:
    - alias: bottlerocket@latest
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: aws-aad-eks-lab
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: aws-aad-eks-lab
  tags:
    Project: armed-and-dangerous
    Environment: lab
    Owner: andres-zeballos
    ManagedBy: karpenter
    aad/arch: amd64
