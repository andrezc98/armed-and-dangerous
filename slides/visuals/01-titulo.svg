<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">
<title>ARMed and Dangerous</title>
<defs>
<linearGradient id="tv-grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4C2FC9"/><stop offset=".5" stop-color="#6D4AE8"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
<linearGradient id="tv-grad-h" gradientUnits="userSpaceOnUse" x1="96" y1="0" x2="1824" y2="0"><stop offset="0" stop-color="#4C2FC9"/><stop offset=".5" stop-color="#6D4AE8"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
<radialGradient id="tv-glow-a"><stop offset="0" stop-color="#A78BFA" stop-opacity=".16"/><stop offset=".45" stop-color="#6D4AE8" stop-opacity=".08"/><stop offset="1" stop-color="#6D4AE8" stop-opacity="0"/></radialGradient>
<radialGradient id="tv-glow-b"><stop offset="0" stop-color="#6D4AE8" stop-opacity=".10"/><stop offset="1" stop-color="#6D4AE8" stop-opacity="0"/></radialGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#15123C" flood-opacity=".07"/></filter>
</defs>
<style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=Montserrat:wght@600;700&amp;family=JetBrains+Mono&amp;display=block');
.k{font:26px 'JetBrains Mono',Menlo,monospace;fill:#15123C}
.h{font-family:Montserrat,Inter,sans-serif;font-size:52px;font-weight:700;fill:#15123C}
.sub{font-size:26px;fill:#5E5A80}
.t{font-size:30px;font-weight:600;fill:#15123C}
.c{font-size:24px;fill:#5E5A80}
.m{font:24px 'JetBrains Mono',Menlo,monospace;fill:#15123C}
.card{fill:#fff;stroke:#DCD6F7;stroke-width:1.5;filter:url(#sh)}
.act{fill:none;stroke:url(#tv-grad);stroke-width:3;filter:drop-shadow(0 0 18px rgb(109 74 232 / .35))}
.idle{fill:none;stroke:#DCD6F7;stroke-width:3;stroke-dasharray:6 6}
.on{fill:none;stroke:#6D4AE8;stroke-width:3}
.dot{fill:#6D4AE8;stroke:#fff;stroke-width:3;filter:drop-shadow(0 0 8px rgb(109 74 232 / .6))}
.gl{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.big{font-size:30px;font-weight:600;fill:#15123C}.lbl{font:24px 'JetBrains Mono',Menlo,monospace;fill:#6D4AE8}.pc{fill:#fff4e5;stroke:#d97706;stroke-width:2;stroke-dasharray:8 6}.pct{font:24px 'JetBrains Mono',Menlo,monospace;fill:#b45309}@media (prefers-reduced-motion: no-preference){.sweep{animation:drift 12s ease-in-out infinite;transform-origin:2350px 540px}@keyframes drift{0%,100%{transform:rotate(0) translateX(0)}50%{transform:rotate(-7deg) translateX(-30px)}}}
</style>
<rect width="1920" height="1080" fill="#fff"/><circle cx="60" cy="1060" r="760" fill="url(#tv-glow-b)"/>
<linearGradient id="sw" gradientUnits="userSpaceOnUse" x1="1150" y1="0" x2="1920" y2="1080"><stop offset="0" stop-color="#4C2FC9"/><stop offset=".5" stop-color="#6D4AE8"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
<g class="sweep">
  <circle cx="2350" cy="540" r="1150" fill="none" stroke="url(#sw)" stroke-width="10" opacity=".35"/>
  <circle cx="2350" cy="540" r="1030" fill="none" stroke="url(#sw)" stroke-width="140" opacity=".9"/>
  <circle cx="2350" cy="540" r="880" fill="none" stroke="url(#sw)" stroke-width="60" opacity=".55"/>
  <circle cx="2350" cy="540" r="790" fill="none" stroke="url(#sw)" stroke-width="18" opacity=".3"/>
</g>
<text x="96" y="400" font-size="92" font-weight="700" fill="#15123C"><tspan fill="url(#tv-grad-h)">ARM</tspan>ed and Dangerous</text>
<text x="96" y="486" font-size="44" fill="#5E5A80">lo que Graviton5 hace con tus workloads,</text>
<text x="96" y="544" font-size="44" fill="#5E5A80">medido en EKS</text>
<path d="M96 600 H336" stroke="url(#tv-grad-h)" stroke-width="8" stroke-linecap="round"/>
<text x="96" y="716" font-size="36" font-weight="600" fill="#15123C">Andrés Zeballos</text>
<text x="96" y="764" font-size="28" fill="#5E5A80">Solutions Architect · phData</text>
<text x="600" y="716" font-size="36" font-weight="600" fill="#15123C">Victor Herrera</text>
<text x="600" y="764" font-size="28" fill="#5E5A80">Cloud Specialist · Caleidos</text>
<text x="96" y="900" class="m" font-size="26" fill="#5E5A80">AWS Community Day Perú 2026 · 3 de octubre · Lima</text>

</svg>
