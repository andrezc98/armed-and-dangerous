<text x="96" y="74" class="k"><tspan fill="#6D4AE8">[</tspan>AJUSTES<tspan fill="#6D4AE8">]</tspan></text><text x="96" y="140" class="h">Ajustar paga, pero no igual en cada chip</text><text x="96" y="192" class="sub">Ganancia frente a la versión sin ajustes; Java + virtual threads, frente a Java con ajustes; más alto = mejor</text><text x="96" y="228" class="sub">En red (1 día), los ajustes de latencia costaron entre 20 % y 124 % más CPU por Gbps recibido</text><rect x="96" y="266" width="24" height="24" rx="4" fill="#6D4AE8"/><text x="132" y="286" class="c">Graviton5 (m9g)</text><rect x="368" y="266" width="24" height="24" rx="4" fill="#0e9f9a"/><text x="404" y="286" class="c">EPYC (m8a)</text><rect x="580" y="266" width="24" height="24" rx="4" fill="#1f6fe5"/><text x="616" y="286" class="c">Xeon 6 (m8i)</text><rect x="96" y="314" width="1728" height="92" rx="14" fill="#F6F4FE" stroke="#DCD6F7" stroke-width="1.5"/><text x="124" y="351" font-family="JetBrains Mono,Menlo,monospace" font-size="20" fill="#6D4AE8">CONFIG</text><text x="264" y="351" font-size="22" fill="#15123C">PostgreSQL: 16 GB de buffers + páginas grandes · Java: páginas grandes + flags de JVM · inferencia: 15 hilos · MongoDB: páginas grandes</text><text x="124" y="387" font-family="JetBrains Mono,Menlo,monospace" font-size="20" fill="#6D4AE8">POR QUÉ</text><text x="264" y="387" font-size="22" fill="#15123C">ajustar rinde donde el default te deja lejos: sin -t, llama.cpp usa 8 hilos en Xeon (+29 %); MongoDB no estuvo limitada por CPU</text><line x1="96" x2="1824" y1="900" y2="900" stroke="#DCD6F7" stroke-width="2"/><path d="M144.0,900 V639.4 a4,4 0 0 1 4,-4 H215.2 a4,4 0 0 1 4,4 V900 Z" fill="#6D4AE8"/><text x="181.6" y="621.4" text-anchor="middle" class="v">+21 %</text><path d="M231.2,900 V663.8 a4,4 0 0 1 4,-4 H302.4 a4,4 0 0 1 4,4 V900 Z" fill="#0e9f9a"/><text x="268.8" y="645.8" text-anchor="middle" class="v">+19 %</text><path d="M318.4,900 V600.5 a4,4 0 0 1 4,-4 H389.6 a4,4 0 0 1 4,4 V900 Z" fill="#1f6fe5"/><text x="356.0" y="582.5" text-anchor="middle" class="v">+24 %</text><text x="268.8" y="948" text-anchor="middle" class="lab">PostgreSQL</text><path d="M489.6,900 V777.9 a4,4 0 0 1 4,-4 H560.8 a4,4 0 0 1 4,4 V900 Z" fill="#6D4AE8"/><text x="527.2" y="759.9" text-anchor="middle" class="v">+10 %</text><path d="M576.8,900 V889.8 a4,4 0 0 1 4,-4 H648.0 a4,4 0 0 1 4,4 V900 Z" fill="#0e9f9a"/><text x="614.4" y="871.8" text-anchor="middle" class="v">+1 %</text><path d="M664.0,900 V712.1 a4,4 0 0 1 4,-4 H735.2 a4,4 0 0 1 4,4 V900 Z" fill="#1f6fe5"/><text x="701.6" y="694.1" text-anchor="middle" class="v">+15 %</text><text x="614.4" y="948" text-anchor="middle" class="lab">Java</text><path d="M835.2,900 V603.1 a4,4 0 0 1 4,-4 H906.4 a4,4 0 0 1 4,4 V900 Z" fill="#6D4AE8"/><text x="872.8" y="585.1" text-anchor="middle" class="v">+24 %</text><path d="M922.4,900 V637.8 a4,4 0 0 1 4,-4 H993.6 a4,4 0 0 1 4,4 V900 Z" fill="#0e9f9a"/><text x="960.0" y="619.8" text-anchor="middle" class="v">+21 %</text><path d="M1009.6,900 V832.6 a4,4 0 0 1 4,-4 H1080.8 a4,4 0 0 1 4,4 V900 Z" fill="#1f6fe5"/><text x="1047.2" y="814.6" text-anchor="middle" class="v">+6 %</text><text x="960.0" y="948" text-anchor="middle" class="lab">Java + v. threads</text><path d="M1180.8,900 V811.2 a4,4 0 0 1 4,-4 H1252.0 a4,4 0 0 1 4,4 V900 Z" fill="#6D4AE8"/><text x="1218.4" y="793.2" text-anchor="middle" class="v">+7 %</text><path d="M1268.0,900 V651.7 a4,4 0 0 1 4,-4 H1339.2 a4,4 0 0 1 4,4 V900 Z" fill="#0e9f9a"/><text x="1305.6" y="633.7" text-anchor="middle" class="v">+20 %</text><path d="M1355.2,900 V533.2 a4,4 0 0 1 4,-4 H1426.4 a4,4 0 0 1 4,4 V900 Z" fill="#1f6fe5"/><text x="1392.8" y="515.2" text-anchor="middle" class="v">+29 %</text><text x="1305.6" y="948" text-anchor="middle" class="lab">Inferencia</text><path d="M1526.4,900 V901.0 a4,4 0 0 1 4,-4 H1597.6 a4,4 0 0 1 4,4 V900 Z" fill="#6D4AE8"/><text x="1564.0" y="883.0" text-anchor="middle" class="v">0 %</text><path d="M1613.6,900 V907.7 a4,4 0 0 1 4,-4 H1684.8 a4,4 0 0 1 4,4 V900 Z" fill="#0e9f9a"/><text x="1651.2" y="889.7" text-anchor="middle" class="v">0 %</text><path d="M1700.8,900 V869.0 a4,4 0 0 1 4,-4 H1772.0 a4,4 0 0 1 4,4 V900 Z" fill="#1f6fe5"/><text x="1738.4" y="851.0" text-anchor="middle" class="v">+3 %</text><text x="1651.2" y="948" text-anchor="middle" class="lab">MongoDB</text><text x="96" y="990" class="src">Fuente: lab propio, Task 7, media de 2 días; dentro del ruido: Java en EPYC, MongoDB en Graviton5 y EPYC; inferencia en Graviton5: leve (0–13 %)</text></svg>
