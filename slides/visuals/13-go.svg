<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">
<title>Go: Graviton5 atiende 1.8× lo que Xeon 6</title>
<defs>
<linearGradient id="tv-grad-h" gradientUnits="userSpaceOnUse" x1="96" y1="0" x2="1824" y2="0"><stop offset="0" stop-color="#4C2FC9"/><stop offset=".5" stop-color="#6D4AE8"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
<radialGradient id="tv-glow-a"><stop offset="0" stop-color="#A78BFA" stop-opacity=".16"/><stop offset=".45" stop-color="#6D4AE8" stop-opacity=".08"/><stop offset="1" stop-color="#6D4AE8" stop-opacity="0"/></radialGradient>
<radialGradient id="tv-glow-b"><stop offset="0" stop-color="#6D4AE8" stop-opacity=".10"/><stop offset="1" stop-color="#6D4AE8" stop-opacity="0"/></radialGradient>
</defs>
<style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=Montserrat:wght@600;700&amp;family=JetBrains+Mono&amp;display=block');
.k{font:26px 'JetBrains Mono',Menlo,monospace;fill:#15123C}
.h{font-family:Montserrat,Inter,sans-serif;font-size:50px;font-weight:700;fill:#15123C}
.sub{font-size:26px;fill:#5E5A80}
.v{font-size:28px;font-weight:600;fill:#15123C}
.lab{font-size:28px;font-weight:600;fill:#15123C}
.c{font-size:24px;fill:#5E5A80}
.src{font-size:24px;fill:#5E5A80}
</style>
<rect width="1920" height="1080" fill="#ffffff"/>
<circle cx="1860" cy="40" r="820" fill="url(#tv-glow-a)"/><circle cx="60" cy="1060" r="760" fill="url(#tv-glow-b)"/>
<text x="96" y="74" class="k"><tspan fill="#6D4AE8">[</tspan>GO<tspan fill="#6D4AE8">]</tspan></text><text x="96" y="140" class="h">Go: Graviton5 atiende 1.8× lo que Xeon 6</text><text x="96" y="192" class="sub">Servicio HTTP: peticiones por segundo con el 99 % en menos de 20 ms; más alto = mejor</text><text x="96" y="228" class="sub">Go se midió solo sin ajustes</text><rect x="96" y="266" width="24" height="24" rx="4" fill="#6D4AE8"/><text x="132" y="286" class="c">Graviton5 (m9g)</text><rect x="368" y="266" width="24" height="24" rx="4" fill="#0e9f9a"/><text x="404" y="286" class="c">EPYC (m8a)</text><rect x="580" y="266" width="24" height="24" rx="4" fill="#1f6fe5"/><text x="616" y="286" class="c">Xeon 6 (m8i)</text><rect x="96" y="314" width="1728" height="92" rx="14" fill="#F6F4FE" stroke="#DCD6F7" stroke-width="1.5"/><text x="124" y="351" font-family="JetBrains Mono,Menlo,monospace" font-size="20" fill="#6D4AE8">CONFIG</text><text x="264" y="351" font-size="22" fill="#15123C">servicio HTTP de la librería estándar, compilado genérico (sin flags por chip) · de 5 mil en 5 mil hasta 100 mil peticiones/s</text><text x="124" y="387" font-family="JetBrains Mono,Menlo,monospace" font-size="20" fill="#6D4AE8">POR QUÉ</text><text x="264" y="387" font-size="22" fill="#15123C">Graviton5 hace más trabajo por ciclo (IPC 1.23 / 1.02 / 0.68) y falla menos al predecir saltos (1.1 / 2.4 / 3.2 por mil)</text><line x1="96" x2="1824" y1="900" y2="900" stroke="#DCD6F7" stroke-width="2"/><path d="M723.0,900 V524.5 a4,4 0 0 1 4,-4 H869.0 a4,4 0 0 1 4,4 V900 Z" fill="#6D4AE8"/><text x="798.0" y="560.5" text-anchor="middle" font-size="22" font-weight="600" fill="#fff">1.8× Xeon 6</text><path d="M798.0,525.7 V515.3 M784.0,525.7 H812.0 M784.0,515.3 H812.0" stroke="#15123C" stroke-width="2.5" fill="none"/><text x="798.0" y="501.3" text-anchor="middle" class="v">36.5k</text><path d="M885.0,900 V602.4 a4,4 0 0 1 4,-4 H1031.0 a4,4 0 0 1 4,4 V900 Z" fill="#0e9f9a"/><text x="960.0" y="638.4" text-anchor="middle" font-size="22" font-weight="600" fill="#fff">1.5× Xeon 6</text><path d="M960.0,608.8 V588.0 M946.0,608.8 H974.0 M946.0,588.0 H974.0" stroke="#15123C" stroke-width="2.5" fill="none"/><text x="960.0" y="574.0" text-anchor="middle" class="v">29k</text><path d="M1047.0,900 V696.0 a4,4 0 0 1 4,-4 H1193.0 a4,4 0 0 1 4,4 V900 Z" fill="#1f6fe5"/><path d="M1122.0,692.0 V692.0 M1108.0,692.0 H1136.0 M1108.0,692.0 H1136.0" stroke="#15123C" stroke-width="2.5" fill="none"/><text x="1122.0" y="678.0" text-anchor="middle" class="v">20k</text><text x="960.0" y="948" text-anchor="middle" class="lab">Sin ajustes</text><text x="96" y="990" class="src">Fuente: lab propio, Task 7, 2 días × 3 runs; barra = media de los 2 días, línea = mín–máx entre días</text></svg>
