<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">
<title>Python y MySQL: pendientes de medir</title>
<defs>
<linearGradient id="tv-grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4C2FC9"/><stop offset=".5" stop-color="#6D4AE8"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
<linearGradient id="tv-grad-h" gradientUnits="userSpaceOnUse" x1="96" y1="0" x2="1824" y2="0"><stop offset="0" stop-color="#4C2FC9"/><stop offset=".5" stop-color="#6D4AE8"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
<radialGradient id="tv-glow-a"><stop offset="0" stop-color="#A78BFA" stop-opacity=".16"/><stop offset=".45" stop-color="#6D4AE8" stop-opacity=".08"/><stop offset="1" stop-color="#6D4AE8" stop-opacity="0"/></radialGradient>
<radialGradient id="tv-glow-b"><stop offset="0" stop-color="#6D4AE8" stop-opacity=".10"/><stop offset="1" stop-color="#6D4AE8" stop-opacity="0"/></radialGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#15123C" flood-opacity=".07"/></filter>
</defs>
<style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=Montserrat:wght@600;700&amp;family=JetBrains+Mono&amp;display=block');
.k{font:26px 'JetBrains Mono',Menlo,monospace;fill:#15123C}
.h{font-family:Montserrat,Inter,sans-serif;font-size:52px;font-weight:700;fill:#15123C}
.sub{font-size:26px;fill:#5E5A80}
.t{font-size:30px;font-weight:600;fill:#15123C}
.c{font-size:24px;fill:#5E5A80}
.m{font:24px 'JetBrains Mono',Menlo,monospace;fill:#15123C}
.card{fill:#fff;stroke:#DCD6F7;stroke-width:1.5;filter:url(#sh)}
.act{fill:none;stroke:url(#tv-grad);stroke-width:3;filter:drop-shadow(0 0 18px rgb(109 74 232 / .35))}
.idle{fill:none;stroke:#DCD6F7;stroke-width:3;stroke-dasharray:6 6}
.on{fill:none;stroke:#6D4AE8;stroke-width:3}
.dot{fill:#6D4AE8;stroke:#fff;stroke-width:3;filter:drop-shadow(0 0 8px rgb(109 74 232 / .6))}
.gl{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.hero{font-family:Montserrat,Inter,sans-serif;font-weight:700;fill:url(#tv-grad-h)}.cap{font-size:32px;fill:#15123C}.src{font-size:24px;fill:#5E5A80}.tag{font:24px 'JetBrains Mono',Menlo,monospace;fill:#6D4AE8}.tm{font:24px 'JetBrains Mono',Menlo,monospace;fill:#e6e9ef;white-space:pre;font-variant-ligatures:none}.pc{fill:none;stroke:#d97706;stroke-width:3;stroke-dasharray:12 8}.pct{font:600 24px 'JetBrains Mono',Menlo,monospace;fill:#d97706}@media (prefers-reduced-motion: no-preference){.a{animation:in .7s cubic-bezier(.2,.7,.2,1) both}.ty{animation:ty .01s linear both}@keyframes in{from{opacity:0;transform:translateY(24px)}}@keyframes ty{from{opacity:0}}}
</style>
<rect width="1920" height="1080" fill="#fff"/><circle cx="1860" cy="40" r="820" fill="url(#tv-glow-a)"/><circle cx="60" cy="1060" r="760" fill="url(#tv-glow-b)"/>
<text x="96" y="74" class="k"><tspan fill="#6D4AE8">[</tspan>LO QUE SIGUE<tspan fill="#6D4AE8">]</tspan></text>
<text x="96" y="140" class="h">Python y MySQL: pendientes de medir</text>
<text x="96" y="192" class="sub">Lo que queremos averiguar y lo que ya sabemos</text>
<g class="a" style="animation-delay:0.30s"><rect x="96" y="240" width="846" height="560" rx="20" class="card"/><path d="M96 336 V260 a20 20 0 0 1 20 -20 H922 a20 20 0 0 1 20 20 V336 Z" fill="url(#tv-grad)"/><text x="132" y="304" font-size="40" font-weight="700" fill="#fff">Python</text><rect x="656" y="266" width="252" height="44" rx="22" fill="#fff" fill-opacity=".92"/><text x="782" y="296" text-anchor="middle" font-size="24" font-weight="600" fill="#6D4AE8">no medido todavía</text><text x="132" y="410" font-size="34" font-weight="700" fill="#15123C">¿Qué chip rinde mejor con Python?</text><text x="132" y="464" class="cap" style="font-size:28px;fill:#5E5A80">¿Todas tus dependencias nativas tienen</text><text x="132" y="504" class="cap" style="font-size:28px;fill:#5E5A80">paquetes compilados para arm64?</text><rect x="132" y="560" width="774" height="196" rx="16" fill="#F6F4FE" stroke="#DCD6F7" stroke-width="1.5"/><text x="160" y="610" class="k" style="fill:#6D4AE8;font-size:22px">LO QUE YA SABEMOS</text><text x="160" y="662" class="cap" style="font-size:28px">Phoronix: m9g superó a m8g</text><text x="160" y="702" class="cap" style="font-size:28px">en PyPerformance (terceros)</text></g>
<g class="a" style="animation-delay:0.70s"><rect x="978" y="240" width="846" height="560" rx="20" class="card"/><path d="M978 336 V260 a20 20 0 0 1 20 -20 H1804 a20 20 0 0 1 20 20 V336 Z" fill="url(#tv-grad)"/><text x="1014" y="304" font-size="40" font-weight="700" fill="#fff">MySQL</text><rect x="1538" y="266" width="252" height="44" rx="22" fill="#fff" fill-opacity=".92"/><text x="1664" y="296" text-anchor="middle" font-size="24" font-weight="600" fill="#6D4AE8">no medido todavía</text><text x="1014" y="410" font-size="34" font-weight="700" fill="#15123C">¿EPYC también lidera en MySQL?</text><text x="1014" y="464" class="cap" style="font-size:28px;fill:#5E5A80">¿O su ventaja era de PostgreSQL</text><text x="1014" y="504" class="cap" style="font-size:28px;fill:#5E5A80">y no de las bases relacionales?</text><rect x="1014" y="560" width="774" height="196" rx="16" fill="#F6F4FE" stroke="#DCD6F7" stroke-width="1.5"/><text x="1042" y="610" class="k" style="fill:#6D4AE8;font-size:22px">LO QUE YA SABEMOS</text><text x="1042" y="662" class="cap" style="font-size:28px">PostgreSQL con ajustes: EPYC 1.75×</text><text x="1042" y="702" class="cap" style="font-size:28px">Xeon 6; Graviton5 y Xeon 6 empataron</text></g>
<text x="96" y="1000" class="src">Fuente: PostgreSQL medido en el lab (Task 7); PyPerformance: Phoronix, 2026-07-09 (terceros)</text>

</svg>
