<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">
<title>¿Por qué no lo usan?</title>
<defs>
<linearGradient id="tv-grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4C2FC9"/><stop offset=".5" stop-color="#6D4AE8"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
<linearGradient id="tv-grad-h" gradientUnits="userSpaceOnUse" x1="96" y1="0" x2="1824" y2="0"><stop offset="0" stop-color="#4C2FC9"/><stop offset=".5" stop-color="#6D4AE8"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
<radialGradient id="tv-glow-a"><stop offset="0" stop-color="#A78BFA" stop-opacity=".16"/><stop offset=".45" stop-color="#6D4AE8" stop-opacity=".08"/><stop offset="1" stop-color="#6D4AE8" stop-opacity="0"/></radialGradient>
<radialGradient id="tv-glow-b"><stop offset="0" stop-color="#6D4AE8" stop-opacity=".10"/><stop offset="1" stop-color="#6D4AE8" stop-opacity="0"/></radialGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#15123C" flood-opacity=".07"/></filter>
</defs>
<style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=Montserrat:wght@600;700&amp;family=JetBrains+Mono&amp;display=block');
.k{font:26px 'JetBrains Mono',Menlo,monospace;fill:#15123C}
.h{font-family:Montserrat,Inter,sans-serif;font-size:52px;font-weight:700;fill:#15123C}
.sub{font-size:26px;fill:#5E5A80}
.t{font-size:30px;font-weight:600;fill:#15123C}
.c{font-size:24px;fill:#5E5A80}
.m{font:24px 'JetBrains Mono',Menlo,monospace;fill:#15123C}
.card{fill:#fff;stroke:#DCD6F7;stroke-width:1.5;filter:url(#sh)}
.act{fill:none;stroke:url(#tv-grad);stroke-width:3;filter:drop-shadow(0 0 18px rgb(109 74 232 / .35))}
.idle{fill:none;stroke:#DCD6F7;stroke-width:3;stroke-dasharray:6 6}
.on{fill:none;stroke:#6D4AE8;stroke-width:3}
.dot{fill:#6D4AE8;stroke:#fff;stroke-width:3;filter:drop-shadow(0 0 8px rgb(109 74 232 / .6))}
.gl{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.big{font-size:30px;font-weight:600;fill:#15123C}.lbl{font:24px 'JetBrains Mono',Menlo,monospace;fill:#6D4AE8}.pc{fill:#fff4e5;stroke:#d97706;stroke-width:2;stroke-dasharray:8 6}.pct{font:24px 'JetBrains Mono',Menlo,monospace;fill:#b45309}@media (prefers-reduced-motion: no-preference){@keyframes in{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}.in{animation:in .7s cubic-bezier(.2,.7,.2,1) both}}
</style>
<rect width="1920" height="1080" fill="#fff"/><circle cx="1860" cy="40" r="820" fill="url(#tv-glow-a)"/><circle cx="60" cy="1060" r="760" fill="url(#tv-glow-b)"/>
<text x="96" y="74" class="k"><tspan fill="#6D4AE8">[</tspan>LA PREGUNTA<tspan fill="#6D4AE8">]</tspan></text>
<text x="96" y="140" class="h">¿Por qué no lo usan?</text>
<text x="96" y="192" class="sub">Cuatro dudas que escuchamos cada vez que alguien propone migrar</text>
<g class="in" style="animation-delay:0.30s"><text x="96" y="286" class="lbl">[ADOPCIÓN HOY]</text><text x="90" y="470" font-size="210" font-weight="700" fill="url(#tv-grad-h)">9 %</text><text x="96" y="532" font-size="32" font-weight="600" fill="#15123C">de las CPU en clústeres</text><text x="96" y="572" font-size="32" font-weight="600" fill="#15123C">Kubernetes ya son Arm</text><text x="96" y="622" class="c">y crecen 3.5× más rápido que x86</text><path d="M96 668 H560" stroke="#DCD6F7" stroke-width="2"/><text x="96" y="716" class="c">Instancias cloud en Arm:</text><text x="96" y="764" font-size="40" font-weight="700" fill="#15123C">9 % → 15 %</text><text x="96" y="802" class="c">en dos años</text><rect x="96" y="846" width="496" height="90" rx="18" fill="#F6F4FE" stroke="#DCD6F7" stroke-width="1.5"/><text x="124" y="882" class="c">detrás de las cuatro dudas:</text><text x="124" y="920" font-size="30" font-weight="600" fill="#15123C">desconocimiento · temor</text></g>
<g class="in" style="animation-delay:0.75s"><rect x="660" y="220" width="570" height="358" rx="20" class="card"/><text x="692" y="272" class="lbl">[PRECIO]</text><text x="692" y="320" class="big">¿De verdad sale más barato?</text><text x="692" y="410" font-size="24" font-style="italic" fill="#5E5A80">se escucha: “El ahorro es de marketing”</text><text x="692" y="456" class="lbl" style="fill:#0e9f9a">LO QUE PROBAMOS</text><text x="692" y="496" class="c">Rendimiento por dólar en 6 cargas,</text><text x="692" y="530" class="c">con precios on-demand y Spot</text></g>
<g class="in" style="animation-delay:1.20s"><rect x="1254" y="220" width="570" height="358" rx="20" class="card"/><text x="1286" y="272" class="lbl">[COMPATIBILIDAD]</text><text x="1286" y="320" class="big">¿Mis imágenes y DaemonSets</text><text x="1286" y="358" class="big">corren en ARM?</text><text x="1286" y="410" font-size="24" font-style="italic" fill="#5E5A80">se escucha: “Algo se va a romper”</text><text x="1286" y="456" class="lbl" style="fill:#0e9f9a">LO QUE PROBAMOS</text><text x="1286" y="496" class="c">Un DaemonSet solo amd64 en un</text><text x="1286" y="530" class="c">clúster con nodos x86 y Graviton</text></g>
<g class="in" style="animation-delay:1.65s"><rect x="660" y="602" width="570" height="358" rx="20" class="card"/><text x="692" y="654" class="lbl">[ESFUERZO]</text><text x="692" y="702" class="big">¿Cuánto trabajo me cuesta</text><text x="692" y="740" class="big">migrar?</text><text x="692" y="792" font-size="24" font-style="italic" fill="#5E5A80">se escucha: “Es un proyecto de meses”</text><text x="692" y="838" class="lbl" style="fill:#0e9f9a">LO QUE PROBAMOS</text><text x="692" y="878" class="c">Node groups mixtos y Karpenter</text><text x="692" y="912" class="c">en el mismo clúster</text></g>
<g class="in" style="animation-delay:2.10s"><rect x="1254" y="602" width="570" height="358" rx="20" class="card"/><text x="1286" y="654" class="lbl">[RENDIMIENTO]</text><text x="1286" y="702" class="big">¿Y si mi app rinde menos</text><text x="1286" y="740" class="big">en ARM?</text><text x="1286" y="792" font-size="24" font-style="italic" fill="#5E5A80">se escucha: “ARM es para cargas chicas”</text><text x="1286" y="838" class="lbl" style="fill:#0e9f9a">LO QUE PROBAMOS</text><text x="1286" y="878" class="c">La misma app de m5 a m9g, y 7 cargas</text><text x="1286" y="912" class="c">en Graviton5, EPYC y Xeon 6</text></g>
<text x="96" y="990" class="c">Fuente: Cast AI, 2026 State of Kubernetes Optimization Report (sus clientes); Datadog, State of Containers and Serverless 2025</text>

</svg>
