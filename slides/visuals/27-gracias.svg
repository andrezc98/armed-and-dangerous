<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">
<title>Gracias</title>
<defs>
<linearGradient id="tv-grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4C2FC9"/><stop offset=".5" stop-color="#6D4AE8"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
<linearGradient id="tv-grad-h" gradientUnits="userSpaceOnUse" x1="96" y1="0" x2="1824" y2="0"><stop offset="0" stop-color="#4C2FC9"/><stop offset=".5" stop-color="#6D4AE8"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
<radialGradient id="tv-glow-a"><stop offset="0" stop-color="#A78BFA" stop-opacity=".16"/><stop offset=".45" stop-color="#6D4AE8" stop-opacity=".08"/><stop offset="1" stop-color="#6D4AE8" stop-opacity="0"/></radialGradient>
<radialGradient id="tv-glow-b"><stop offset="0" stop-color="#6D4AE8" stop-opacity=".10"/><stop offset="1" stop-color="#6D4AE8" stop-opacity="0"/></radialGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#15123C" flood-opacity=".07"/></filter>
</defs>
<style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=Montserrat:wght@600;700&amp;family=JetBrains+Mono&amp;display=block');
.k{font:26px 'JetBrains Mono',Menlo,monospace;fill:#15123C}
.h{font-family:Montserrat,Inter,sans-serif;font-size:52px;font-weight:700;fill:#15123C}
.sub{font-size:26px;fill:#5E5A80}
.t{font-size:30px;font-weight:600;fill:#15123C}
.c{font-size:24px;fill:#5E5A80}
.m{font:24px 'JetBrains Mono',Menlo,monospace;fill:#15123C}
.card{fill:#fff;stroke:#DCD6F7;stroke-width:1.5;filter:url(#sh)}
.act{fill:none;stroke:url(#tv-grad);stroke-width:3;filter:drop-shadow(0 0 18px rgb(109 74 232 / .35))}
.idle{fill:none;stroke:#DCD6F7;stroke-width:3;stroke-dasharray:6 6}
.on{fill:none;stroke:#6D4AE8;stroke-width:3}
.dot{fill:#6D4AE8;stroke:#fff;stroke-width:3;filter:drop-shadow(0 0 8px rgb(109 74 232 / .6))}
.gl{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.hero{font-family:Montserrat,Inter,sans-serif;font-weight:700;fill:url(#tv-grad-h)}.cap{font-size:32px;fill:#15123C}.src{font-size:24px;fill:#5E5A80}.tag{font:24px 'JetBrains Mono',Menlo,monospace;fill:#6D4AE8}.tm{font:24px 'JetBrains Mono',Menlo,monospace;fill:#e6e9ef;white-space:pre;font-variant-ligatures:none}.pc{fill:none;stroke:#d97706;stroke-width:3;stroke-dasharray:12 8}.pct{font:600 24px 'JetBrains Mono',Menlo,monospace;fill:#d97706}@media (prefers-reduced-motion: no-preference){.a{animation:in .7s cubic-bezier(.2,.7,.2,1) both}.ty{animation:ty .01s linear both}@keyframes in{from{opacity:0;transform:translateY(24px)}}@keyframes ty{from{opacity:0}}}@media (prefers-reduced-motion: no-preference){.sweep{animation:drift 12s ease-in-out infinite;transform-origin:2350px 540px}@keyframes drift{0%,100%{transform:rotate(0) translateX(0)}50%{transform:rotate(-7deg) translateX(-30px)}}}
</style>
<rect width="1920" height="1080" fill="#fff"/><circle cx="60" cy="1060" r="760" fill="url(#tv-glow-b)"/>
<linearGradient id="sw" gradientUnits="userSpaceOnUse" x1="1150" y1="0" x2="1920" y2="1080"><stop offset="0" stop-color="#4C2FC9"/><stop offset=".5" stop-color="#6D4AE8"/><stop offset="1" stop-color="#A78BFA"/></linearGradient><g class="sweep"><circle cx="2350" cy="540" r="1150" fill="none" stroke="url(#sw)" stroke-width="10" opacity=".35"/><circle cx="2350" cy="540" r="1030" fill="none" stroke="url(#sw)" stroke-width="140" opacity=".9"/><circle cx="2350" cy="540" r="880" fill="none" stroke="url(#sw)" stroke-width="60" opacity=".55"/><circle cx="2350" cy="540" r="790" fill="none" stroke="url(#sw)" stroke-width="18" opacity=".3"/></g>
<text x="96" y="300" class="k"><tspan fill="#6D4AE8">[</tspan>ARMED AND DANGEROUS<tspan fill="#6D4AE8">]</tspan></text>
<text x="96" y="430" font-size="120" font-weight="700" fill="#15123C">Gracias</text>
<text x="96" y="500" class="sub" style="font-size:32px">Tres chips, siete workloads, un mismo clúster EKS</text>
<text x="96" y="640" font-size="44" font-weight="600" fill="#15123C">Andrés Zeballos</text><text x="96" y="744" class="m" style="fill:#6D4AE8">in/andreszc</text><text x="96" y="782" class="m" style="fill:#6D4AE8">github.com/andrezc98</text><text x="96" y="688" font-size="28" fill="#5E5A80">Solutions Architect · phData</text><text x="640" y="640" font-size="44" font-weight="600" fill="#15123C">Victor Herrera</text><text x="640" y="688" font-size="28" fill="#5E5A80">Cloud Specialist · Caleidos</text><text x="640" y="744" class="m" style="fill:#6D4AE8">in/victor-herreraa</text><text x="640" y="782" class="m" style="fill:#6D4AE8">github.com/VotircH</text><text x="96" y="930" class="m" fill="#5E5A80" style="fill:#5E5A80">ACD Perú · 3 de octubre de 2026 · Colaboratorio</text>

