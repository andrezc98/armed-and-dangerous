<text x="96" y="74" class="k"><tspan fill="#6D4AE8">[</tspan>INFERENCIA<tspan fill="#6D4AE8">]</tspan></text><text x="96" y="140" class="h">Llama 3.1 8B en CPU: Graviton5 genera ~2× los tokens de Xeon 6</text><text x="96" y="192" class="sub">Tokens generados por segundo, sumados entre 4 usuarios a la vez (llama.cpp, Q4_0); más alto = mejor</text><text x="96" y="228" class="sub">Con ajustes, un millón de tokens cuesta $2.09 en Graviton5, $3.49 en EPYC y $4.09 en Xeon 6</text><rect x="96" y="266" width="24" height="24" rx="4" fill="#6D4AE8"/><text x="132" y="286" class="c">Graviton5 (m9g)</text><rect x="368" y="266" width="24" height="24" rx="4" fill="#0e9f9a"/><text x="404" y="286" class="c">EPYC (m8a)</text><rect x="580" y="266" width="24" height="24" rx="4" fill="#1f6fe5"/><text x="616" y="286" class="c">Xeon 6 (m8i)</text><rect x="96" y="314" width="1728" height="92" rx="14" fill="#F6F4FE" stroke="#DCD6F7" stroke-width="1.5"/><text x="124" y="351" font-family="JetBrains Mono,Menlo,monospace" font-size="20" fill="#6D4AE8">CONFIG</text><text x="264" y="351" font-size="22" fill="#15123C">modelo de 4.7 GB · 4 usuarios a la vez, respuestas de 128 tokens, mismo prompt · runs de 6 minutos</text><text x="124" y="387" font-family="JetBrains Mono,Menlo,monospace" font-size="20" fill="#6D4AE8">POR QUÉ</text><text x="264" y="387" font-size="22" fill="#15123C">sin ajustes, llama.cpp usa 8 hilos en Xeon y 16 en los otros; con 15 hilos, Graviton5 sigue arriba (IPC 1.01 / 0.82 / 0.62)</text><line x1="96" x2="1824" y1="900" y2="900" stroke="#DCD6F7" stroke-width="2"/><path d="M291.0,900 V558.9 a4,4 0 0 1 4,-4 H437.0 a4,4 0 0 1 4,4 V900 Z" fill="#6D4AE8"/><text x="366.0" y="594.9" text-anchor="middle" font-size="22" font-weight="600" fill="#fff">2.2× Xeon 6</text><path d="M366.0,557.2 V552.6 M352.0,557.2 H380.0 M352.0,552.6 H380.0" stroke="#15123C" stroke-width="2.5" fill="none"/><text x="366.0" y="538.6" text-anchor="middle" class="v">96.9</text><path d="M453.0,900 V674.1 a4,4 0 0 1 4,-4 H599.0 a4,4 0 0 1 4,4 V900 Z" fill="#0e9f9a"/><text x="528.0" y="710.1" text-anchor="middle" font-size="22" font-weight="600" fill="#fff">1.5× Xeon 6</text><path d="M528.0,671.5 V668.6 M514.0,671.5 H542.0 M514.0,668.6 H542.0" stroke="#15123C" stroke-width="2.5" fill="none"/><text x="528.0" y="654.6" text-anchor="middle" class="v">64.6</text><path d="M615.0,900 V745.8 a4,4 0 0 1 4,-4 H761.0 a4,4 0 0 1 4,4 V900 Z" fill="#1f6fe5"/><path d="M690.0,744.9 V738.6 M676.0,744.9 H704.0 M676.0,738.6 H704.0" stroke="#15123C" stroke-width="2.5" fill="none"/><text x="690.0" y="724.6" text-anchor="middle" class="v">44.4</text><text x="528.0" y="948" text-anchor="middle" class="lab">Sin ajustes</text><path d="M1155.0,900 V533.5 a4,4 0 0 1 4,-4 H1301.0 a4,4 0 0 1 4,4 V900 Z" fill="#6D4AE8"/><text x="1230.0" y="569.5" text-anchor="middle" font-size="22" font-weight="600" fill="#fff">1.8× Xeon 6</text><path d="M1230.0,543.7 V515.3 M1216.0,543.7 H1244.0 M1216.0,515.3 H1244.0" stroke="#15123C" stroke-width="2.5" fill="none"/><text x="1230.0" y="501.3" text-anchor="middle" class="v">104.0</text><path d="M1317.0,900 V628.1 a4,4 0 0 1 4,-4 H1463.0 a4,4 0 0 1 4,4 V900 Z" fill="#0e9f9a"/><text x="1392.0" y="664.1" text-anchor="middle" font-size="22" font-weight="600" fill="#fff">1.3× Xeon 6</text><path d="M1392.0,624.1 V624.1 M1378.0,624.1 H1406.0 M1378.0,624.1 H1406.0" stroke="#15123C" stroke-width="2.5" fill="none"/><text x="1392.0" y="610.1" text-anchor="middle" class="v">77.5</text><path d="M1479.0,900 V699.2 a4,4 0 0 1 4,-4 H1625.0 a4,4 0 0 1 4,4 V900 Z" fill="#1f6fe5"/><path d="M1554.0,699.5 V691.0 M1540.0,699.5 H1568.0 M1540.0,691.0 H1568.0" stroke="#15123C" stroke-width="2.5" fill="none"/><text x="1554.0" y="677.0" text-anchor="middle" class="v">57.5</text><text x="1392.0" y="948" text-anchor="middle" class="lab">Con ajustes (15 hilos + páginas grandes)</text><text x="96" y="990" class="src">Fuente: lab propio, Task 7, 2 días × 3 runs de 6 min; barra = media de los 2 días, línea = mín–máx; $/M tokens: solo el nodo, on-demand</text></svg>
