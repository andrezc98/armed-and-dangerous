<text x="96" y="74" class="k"><tspan fill="#6D4AE8">[</tspan>ARCO GENERACIONAL<tspan fill="#6D4AE8">]</tspan></text><text x="96" y="140" class="h">Con Java, cada petición en m9g cuesta un tercio que en m5</text><text x="96" y="192" class="sub">Costo del nodo por cada mil millones de peticiones, al punto de quiebre, on-demand us-east-1; más corto = mejor</text><text x="96" y="228" class="sub">Si debes seguir en x86: m8a cuesta un tercio (2.96× por $); m8i, poco más de la mitad (1.81×)</text><text x="96" y="330" font-size="30" font-weight="700" fill="#15123C">m5</text><text x="96" y="354" font-size="20" fill="#5E5A80">Intel Xeon</text><rect x="440" y="308" width="853.3" height="42" rx="6" fill="#1f6fe5"/><text x="1311.3" y="338" font-size="26" font-weight="600" fill="#15123C">$8.89</text><text x="96" y="392" font-size="30" font-weight="700" fill="#15123C">m6i</text><text x="96" y="416" font-size="20" fill="#5E5A80">Intel Xeon</text><rect x="440" y="370" width="640.0" height="42" rx="6" fill="#1f6fe5"/><text x="1098.0" y="400" font-size="26" font-weight="600" fill="#15123C">$6.67 · 1.3× más barato que m5</text><text x="96" y="454" font-size="30" font-weight="700" fill="#15123C">m7i</text><text x="96" y="478" font-size="20" fill="#5E5A80">Intel Xeon</text><rect x="440" y="432" width="597.3" height="42" rx="6" fill="#1f6fe5"/><text x="1055.3" y="462" font-size="26" font-weight="600" fill="#15123C">$6.22 · 1.4× más barato que m5</text><text x="96" y="516" font-size="30" font-weight="700" fill="#15123C">m8i</text><text x="96" y="540" font-size="20" fill="#5E5A80">Intel Xeon 6</text><rect x="440" y="494" width="470.4" height="42" rx="6" fill="#1f6fe5"/><text x="928.4" y="524" font-size="26" font-weight="600" fill="#15123C">$4.90 · 1.8× más barato que m5</text><text x="96" y="604" font-size="30" font-weight="700" fill="#15123C">m8a</text><text x="96" y="628" font-size="20" fill="#5E5A80">AMD EPYC 5.ª gen</text><rect x="440" y="582" width="288.5" height="42" rx="6" fill="#0e9f9a"/><text x="746.5" y="612" font-size="26" font-weight="600" fill="#15123C">$3.01 · 3.0× más barato que m5</text><text x="96" y="692" font-size="30" font-weight="700" fill="#15123C">m6g</text><text x="96" y="716" font-size="20" fill="#5E5A80">Graviton2</text><rect x="440" y="670" width="746.7" height="42" rx="6" fill="#6D4AE8"/><text x="1204.7" y="700" font-size="26" font-weight="600" fill="#15123C">$7.78 · 1.1× más barato que m5</text><text x="96" y="754" font-size="30" font-weight="700" fill="#15123C">m7g</text><text x="96" y="778" font-size="20" fill="#5E5A80">Graviton3</text><rect x="440" y="732" width="669.5" height="42" rx="6" fill="#6D4AE8"/><text x="1127.5" y="762" font-size="26" font-weight="600" fill="#15123C">$6.97 · 1.3× más barato que m5</text><text x="96" y="816" font-size="30" font-weight="700" fill="#15123C">m8g</text><text x="96" y="840" font-size="20" fill="#5E5A80">Graviton4</text><rect x="440" y="794" width="478.7" height="42" rx="6" fill="#6D4AE8"/><text x="936.7" y="824" font-size="26" font-weight="600" fill="#15123C">$4.99 · 1.8× más barato que m5</text><text x="96" y="878" font-size="30" font-weight="700" fill="#15123C">m9g</text><text x="96" y="902" font-size="20" fill="#5E5A80">Graviton5</text><rect x="440" y="856" width="260.9" height="42" rx="6" fill="#6D4AE8"/><text x="718.9" y="886" font-size="26" font-weight="600" fill="#15123C">$2.72 · 3.3× más barato que m5</text><text x="96" y="990" class="src">Fuente: lab propio, Task 8, 1 run por familia; precios: AWS Pricing API; orientativo</text></svg>
