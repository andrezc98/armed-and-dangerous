<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">
<title>Qué haría según tu punto de partida</title>
<defs>
<linearGradient id="tv-grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4C2FC9"/><stop offset=".5" stop-color="#6D4AE8"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
<linearGradient id="tv-grad-h" gradientUnits="userSpaceOnUse" x1="96" y1="0" x2="1824" y2="0"><stop offset="0" stop-color="#4C2FC9"/><stop offset=".5" stop-color="#6D4AE8"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
<radialGradient id="tv-glow-a"><stop offset="0" stop-color="#A78BFA" stop-opacity=".16"/><stop offset=".45" stop-color="#6D4AE8" stop-opacity=".08"/><stop offset="1" stop-color="#6D4AE8" stop-opacity="0"/></radialGradient>
<radialGradient id="tv-glow-b"><stop offset="0" stop-color="#6D4AE8" stop-opacity=".10"/><stop offset="1" stop-color="#6D4AE8" stop-opacity="0"/></radialGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#15123C" flood-opacity=".07"/></filter>
</defs>
<style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=Montserrat:wght@600;700&amp;family=JetBrains+Mono&amp;display=block');
.k{font:26px 'JetBrains Mono',Menlo,monospace;fill:#15123C}
.h{font-family:Montserrat,Inter,sans-serif;font-size:52px;font-weight:700;fill:#15123C}
.sub{font-size:26px;fill:#5E5A80}
.t{font-size:30px;font-weight:600;fill:#15123C}
.c{font-size:24px;fill:#5E5A80}
.m{font:24px 'JetBrains Mono',Menlo,monospace;fill:#15123C}
.card{fill:#fff;stroke:#DCD6F7;stroke-width:1.5;filter:url(#sh)}
.act{fill:none;stroke:url(#tv-grad);stroke-width:3;filter:drop-shadow(0 0 18px rgb(109 74 232 / .35))}
.idle{fill:none;stroke:#DCD6F7;stroke-width:3;stroke-dasharray:6 6}
.on{fill:none;stroke:#6D4AE8;stroke-width:3}
.dot{fill:#6D4AE8;stroke:#fff;stroke-width:3;filter:drop-shadow(0 0 8px rgb(109 74 232 / .6))}
.gl{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.hero{font-family:Montserrat,Inter,sans-serif;font-weight:700;fill:url(#tv-grad-h)}.cap{font-size:32px;fill:#15123C}.src{font-size:24px;fill:#5E5A80}.tag{font:24px 'JetBrains Mono',Menlo,monospace;fill:#6D4AE8}.tm{font:24px 'JetBrains Mono',Menlo,monospace;fill:#e6e9ef;white-space:pre;font-variant-ligatures:none}.pc{fill:none;stroke:#d97706;stroke-width:3;stroke-dasharray:12 8}.pct{font:600 24px 'JetBrains Mono',Menlo,monospace;fill:#d97706}@media (prefers-reduced-motion: no-preference){.a{animation:in .7s cubic-bezier(.2,.7,.2,1) both}.ty{animation:ty .01s linear both}@keyframes in{from{opacity:0;transform:translateY(24px)}}@keyframes ty{from{opacity:0}}}
</style>
<rect width="1920" height="1080" fill="#fff"/><circle cx="1860" cy="40" r="820" fill="url(#tv-glow-a)"/><circle cx="60" cy="1060" r="760" fill="url(#tv-glow-b)"/>
<text x="96" y="74" class="k"><tspan fill="#6D4AE8">[</tspan>RECOMENDACIONES<tspan fill="#6D4AE8">]</tspan></text>
<text x="96" y="140" class="h">Qué haría según tu punto de partida</text>
<text x="96" y="192" class="sub">Rutas de la guía de decisión; las cifras del arco son Java sin ajustes frente a m5.4xlarge, mismo JDK</text>
<g class="a" style="animation-delay:0.30s"><rect x="96" y="226" width="1728" height="124" rx="20" class="card"/><rect x="124" y="248" width="80" height="80" rx="14" fill="url(#tv-grad)"/><text x="164" y="302" text-anchor="middle" font-size="34" font-weight="700" fill="#fff">01</text><text x="236" y="280" class="t">Tienes que seguir en x86 (por el proveedor o la licencia)</text><text x="236" y="320" class="c">m8a; y si puedes, JDK 17+ antes de moverte</text><text x="1792" y="290" text-anchor="end" font-size="50" class="hero">3.75× m5</text><text x="1792" y="328" text-anchor="end" class="tag" style="font-size:20px">[Java · arco]</text></g>
<g class="a" style="animation-delay:0.65s"><rect x="96" y="366" width="1728" height="124" rx="20" class="card"/><rect x="124" y="388" width="80" height="80" rx="14" fill="url(#tv-grad)"/><text x="164" y="442" text-anchor="middle" font-size="34" font-weight="700" fill="#fff">02</text><text x="236" y="420" class="t">Java o Go con imágenes multi-arch</text><text x="236" y="460" class="c">m9g, con la familia fijada en Karpenter (si no, eligió m6g)</text><text x="1792" y="430" text-anchor="end" font-size="50" class="hero">3.3× m5</text><text x="1792" y="468" text-anchor="end" class="tag" style="font-size:20px">[Java · arco]</text></g>
<g class="a" style="animation-delay:1.00s"><rect x="96" y="506" width="1728" height="124" rx="20" class="card"/><rect x="124" y="528" width="80" height="80" rx="14" fill="url(#tv-grad)"/><text x="164" y="582" text-anchor="middle" font-size="34" font-weight="700" fill="#fff">03</text><text x="236" y="560" class="t">PostgreSQL</text><text x="236" y="600" class="c">m8a + shared_buffers de 16 GB y páginas grandes (+19 %)</text><text x="1792" y="570" text-anchor="end" font-size="36" class="hero">1.75× Xeon 6</text><text x="1792" y="608" text-anchor="end" class="tag" style="font-size:20px">[ambos con ajustes]</text></g>
<g class="a" style="animation-delay:1.35s"><rect x="96" y="646" width="1728" height="124" rx="20" class="card"/><rect x="124" y="668" width="80" height="80" rx="14" fill="url(#tv-grad)"/><text x="164" y="722" text-anchor="middle" font-size="34" font-weight="700" fill="#fff">04</text><text x="236" y="700" class="t">Generación de tokens en CPU</text><text x="236" y="740" class="c">m9g, y fija los hilos (-t) al tamaño del pod</text><text x="1792" y="710" text-anchor="end" font-size="36" class="hero">$2.09 / M tokens</text><text x="1792" y="748" text-anchor="end" class="tag" style="font-size:20px">[Llama 3.1 8B · con ajustes]</text></g>
<g class="a" style="animation-delay:1.70s"><rect x="96" y="786" width="1728" height="124" rx="20" class="card"/><rect x="124" y="808" width="80" height="80" rx="14" fill="url(#tv-grad)"/><text x="164" y="862" text-anchor="middle" font-size="34" font-weight="700" fill="#fff">05</text><text x="236" y="840" class="t">Antes de migrar</text><text x="236" y="880" class="c">imágenes multi-arch, DaemonSets y agentes incluidos</text><text x="1792" y="850" text-anchor="end" font-size="36" class="hero">exec format error</text><text x="1792" y="888" text-anchor="end" class="tag" style="font-size:20px">[escena]</text></g>
<text x="96" y="1000" class="src">Fuente: guía de decisión del lab; Task 7 (2 días × 3 runs) y Task 8 (arco, 1 run por familia: orientativo); $/M tokens: solo el nodo, on-demand</text>

</svg>
