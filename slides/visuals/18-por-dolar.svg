<text x="96" y="74" class="k"><tspan fill="#6D4AE8">[</tspan>PRECIO-RENDIMIENTO<tspan fill="#6D4AE8">]</tspan></text><text x="96" y="140" class="h">Por dólar, Graviton5 lidera en seis de siete escenarios</text><text x="96" y="192" class="sub">Cuánto trabajo da cada dólar por hora frente a Xeon 6 (1.00×, línea punteada); más alto = mejor</text><text x="96" y="228" class="sub">Misma variante en los tres chips: con ajustes, salvo Go y red; red = Gbps por dólar, un solo día</text><rect x="96" y="266" width="24" height="24" rx="4" fill="#6D4AE8"/><text x="132" y="286" class="c">Graviton5 (m9g)</text><rect x="368" y="266" width="24" height="24" rx="4" fill="#0e9f9a"/><text x="404" y="286" class="c">EPYC (m8a)</text><line x1="620" x2="664" y1="278" y2="278" stroke="#5E5A80" stroke-width="2" stroke-dasharray="8 8"/><text x="678" y="286" class="c">1.00× = Xeon 6 (m8i)</text><rect x="96" y="314" width="1728" height="92" rx="14" fill="#F6F4FE" stroke="#DCD6F7" stroke-width="1.5"/><text x="124" y="351" font-family="JetBrains Mono,Menlo,monospace" font-size="20" fill="#6D4AE8">CONFIG</text><text x="264" y="351" font-size="22" fill="#15123C">precio por hora, on-demand us-east-1: Graviton5 $0.78 · Xeon 6 $0.85 · EPYC $0.97 (mismo tamaño .4xlarge)</text><text x="124" y="387" font-family="JetBrains Mono,Menlo,monospace" font-size="20" fill="#6D4AE8">POR QUÉ</text><text x="264" y="387" font-size="22" fill="#15123C">Graviton5 cuesta 8 % menos que Xeon 6 y 20 % menos que EPYC, y en estas pruebas rinde igual o más; en PostgreSQL, EPYC compensa su precio</text><line x1="96" x2="1824" y1="900" y2="900" stroke="#DCD6F7" stroke-width="2"/><line x1="96" x2="1824" y1="725.4" y2="725.4" stroke="#5E5A80" stroke-width="2" stroke-dasharray="8 8"/><path d="M150.0,900 V559.3 a4,4 0 0 1 4,-4 H209.4 a4,4 0 0 1 4,4 V900 Z" fill="#6D4AE8"/><path d="M181.7,560.0 V550.5 M167.7,560.0 H195.7 M167.7,550.5 H195.7" stroke="#15123C" stroke-width="2.5" fill="none"/><text x="181.7" y="536.5" text-anchor="middle" class="v">1.97x</text><path d="M225.4,900 V683.8 a4,4 0 0 1 4,-4 H284.9 a4,4 0 0 1 4,4 V900 Z" fill="#0e9f9a"/><path d="M257.1,687.4 V672.2 M243.1,687.4 H271.1 M243.1,672.2 H271.1" stroke="#15123C" stroke-width="2.5" fill="none"/><text x="257.1" y="658.2" text-anchor="middle" class="v">1.26x</text><text x="219.4" y="948" text-anchor="middle" class="lab">Go</text><path d="M396.9,900 V590.4 a4,4 0 0 1 4,-4 H456.3 a4,4 0 0 1 4,4 V900 Z" fill="#6D4AE8"/><path d="M428.6,593.5 V579.2 M414.6,593.5 H442.6 M414.6,579.2 H442.6" stroke="#15123C" stroke-width="2.5" fill="none"/><text x="428.6" y="565.2" text-anchor="middle" class="v">1.80x</text><path d="M472.3,900 V646.2 a4,4 0 0 1 4,-4 H531.7 a4,4 0 0 1 4,4 V900 Z" fill="#0e9f9a"/><path d="M504.0,642.2 V642.2 M490.0,642.2 H518.0 M490.0,642.2 H518.0" stroke="#15123C" stroke-width="2.5" fill="none"/><text x="504.0" y="628.2" text-anchor="middle" class="v">1.48x</text><text x="466.3" y="948" text-anchor="middle" class="lab">Java</text><path d="M643.7,900 V536.3 a4,4 0 0 1 4,-4 H703.1 a4,4 0 0 1 4,4 V900 Z" fill="#6D4AE8"/><path d="M675.4,535.7 V529.0 M661.4,535.7 H689.4 M661.4,529.0 H689.4" stroke="#15123C" stroke-width="2.5" fill="none"/><text x="675.4" y="515.0" text-anchor="middle" class="v">2.11x</text><path d="M719.1,900 V608.5 a4,4 0 0 1 4,-4 H778.6 a4,4 0 0 1 4,4 V900 Z" fill="#0e9f9a"/><path d="M750.9,607.2 V601.8 M736.9,607.2 H764.9 M736.9,601.8 H764.9" stroke="#15123C" stroke-width="2.5" fill="none"/><text x="750.9" y="587.8" text-anchor="middle" class="v">1.69x</text><text x="713.1" y="948" text-anchor="middle" class="lab">Java + v. threads</text><path d="M890.6,900 V562.2 a4,4 0 0 1 4,-4 H950.0 a4,4 0 0 1 4,4 V900 Z" fill="#6D4AE8"/><path d="M922.3,571.3 V545.1 M908.3,571.3 H936.3 M908.3,545.1 H936.3" stroke="#15123C" stroke-width="2.5" fill="none"/><text x="922.3" y="531.1" text-anchor="middle" class="v">1.96x</text><path d="M966.0,900 V699.4 a4,4 0 0 1 4,-4 H1025.4 a4,4 0 0 1 4,4 V900 Z" fill="#0e9f9a"/><path d="M997.7,695.4 V695.4 M983.7,695.4 H1011.7 M983.7,695.4 H1011.7" stroke="#15123C" stroke-width="2.5" fill="none"/><text x="997.7" y="681.4" text-anchor="middle" class="v">1.17x</text><text x="960.0" y="948" text-anchor="middle" class="lab">Inferencia</text><path d="M1137.4,900 V718.0 a4,4 0 0 1 4,-4 H1196.9 a4,4 0 0 1 4,4 V900 Z" fill="#6D4AE8"/><path d="M1169.1,715.9 V712.2 M1155.1,715.9 H1183.1 M1155.1,712.2 H1183.1" stroke="#15123C" stroke-width="2.5" fill="none"/><text x="1169.1" y="698.2" text-anchor="middle" class="v">1.06x</text><path d="M1212.9,900 V638.9 a4,4 0 0 1 4,-4 H1272.3 a4,4 0 0 1 4,4 V900 Z" fill="#0e9f9a"/><path d="M1244.6,639.6 V630.3 M1230.6,639.6 H1258.6 M1230.6,630.3 H1258.6" stroke="#15123C" stroke-width="2.5" fill="none"/><text x="1244.6" y="616.3" text-anchor="middle" class="v">1.52x</text><text x="1206.9" y="948" text-anchor="middle" class="lab">PostgreSQL</text><path d="M1384.3,900 V666.6 a4,4 0 0 1 4,-4 H1443.7 a4,4 0 0 1 4,4 V900 Z" fill="#6D4AE8"/><path d="M1416.0,663.1 V662.0 M1402.0,663.1 H1430.0 M1402.0,662.0 H1430.0" stroke="#15123C" stroke-width="2.5" fill="none"/><text x="1416.0" y="648.0" text-anchor="middle" class="v">1.36x</text><path d="M1459.7,900 V756.7 a4,4 0 0 1 4,-4 H1519.1 a4,4 0 0 1 4,4 V900 Z" fill="#0e9f9a"/><path d="M1491.4,756.8 V748.6 M1477.4,756.8 H1505.4 M1477.4,748.6 H1505.4" stroke="#15123C" stroke-width="2.5" fill="none"/><text x="1491.4" y="711.4" text-anchor="middle" class="v">0.84x</text><text x="1453.7" y="948" text-anchor="middle" class="lab">MongoDB</text><path d="M1631.1,900 V689.8 a4,4 0 0 1 4,-4 H1690.6 a4,4 0 0 1 4,4 V900 Z" fill="#6D4AE8"/><text x="1662.9" y="671.8" text-anchor="middle" class="v">1.23x</text><path d="M1706.6,900 V752.2 a4,4 0 0 1 4,-4 H1766.0 a4,4 0 0 1 4,4 V900 Z" fill="#0e9f9a"/><text x="1738.3" y="711.4" text-anchor="middle" class="v">0.87x</text><text x="1700.6" y="948" text-anchor="middle" class="lab">Red (Gbps)</text><text x="96" y="990" class="src">Fuente: lab propio, Task 7, 2 días × 3 runs; barra = media de los 2 días, línea = mín–máx entre días; precios: AWS Pricing API</text></svg>
