<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">
<title>MongoDB: Graviton5 atiende 1.3× lo que EPYC y Xeon 6</title>
<defs>
<linearGradient id="tv-grad-h" gradientUnits="userSpaceOnUse" x1="96" y1="0" x2="1824" y2="0"><stop offset="0" stop-color="#4C2FC9"/><stop offset=".5" stop-color="#6D4AE8"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
<radialGradient id="tv-glow-a"><stop offset="0" stop-color="#A78BFA" stop-opacity=".16"/><stop offset=".45" stop-color="#6D4AE8" stop-opacity=".08"/><stop offset="1" stop-color="#6D4AE8" stop-opacity="0"/></radialGradient>
<radialGradient id="tv-glow-b"><stop offset="0" stop-color="#6D4AE8" stop-opacity=".10"/><stop offset="1" stop-color="#6D4AE8" stop-opacity="0"/></radialGradient>
</defs>
<style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=Montserrat:wght@600;700&amp;family=JetBrains+Mono&amp;display=block');
.k{font:26px 'JetBrains Mono',Menlo,monospace;fill:#15123C}
.h{font-family:Montserrat,Inter,sans-serif;font-size:50px;font-weight:700;fill:#15123C}
.sub{font-size:26px;fill:#5E5A80}
.v{font-size:28px;font-weight:600;fill:#15123C}
.lab{font-size:28px;font-weight:600;fill:#15123C}
.c{font-size:24px;fill:#5E5A80}
.src{font-size:24px;fill:#5E5A80}
</style>
<rect width="1920" height="1080" fill="#ffffff"/>
<circle cx="1860" cy="40" r="820" fill="url(#tv-glow-a)"/><circle cx="60" cy="1060" r="760" fill="url(#tv-glow-b)"/>
<text x="96" y="74" class="k"><tspan fill="#6D4AE8">[</tspan>MONGODB<tspan fill="#6D4AE8">]</tspan></text><text x="96" y="140" class="h">MongoDB: Graviton5 atiende 1.3× lo que EPYC y Xeon 6</text><text x="96" y="192" class="sub">Operaciones por segundo con el 99 % de las lecturas en menos de 5 ms; más alto = mejor</text><text x="96" y="228" class="sub">EPYC y Xeon 6 empatan. En este punto, MongoDB no está limitado por la CPU</text><rect x="96" y="266" width="24" height="24" rx="4" fill="#6D4AE8"/><text x="132" y="286" class="c">Graviton5 (m9g)</text><rect x="368" y="266" width="24" height="24" rx="4" fill="#0e9f9a"/><text x="404" y="286" class="c">EPYC (m8a)</text><rect x="580" y="266" width="24" height="24" rx="4" fill="#1f6fe5"/><text x="616" y="286" class="c">Xeon 6 (m8i)</text><rect x="96" y="314" width="1728" height="92" rx="14" fill="#F6F4FE" stroke="#DCD6F7" stroke-width="1.5"/><text x="124" y="351" font-family="JetBrains Mono,Menlo,monospace" font-size="20" fill="#6D4AE8">CONFIG</text><text x="264" y="351" font-size="22" fill="#15123C">YCSB B: 20 M documentos (~20 GB) en caché, 95 % lecturas · de 16 a 512 hilos · quiebre en 128–256 hilos</text><text x="124" y="387" font-family="JetBrains Mono,Menlo,monospace" font-size="20" fill="#6D4AE8">POR QUÉ</text><text x="264" y="387" font-size="22" fill="#15123C">Graviton5 hace más trabajo por ciclo (IPC 1.12 / 0.94 / 0.59), pero aquí la CPU no es el límite: por eso EPYC y Xeon empatan</text><line x1="96" x2="1824" y1="900" y2="900" stroke="#DCD6F7" stroke-width="2"/><path d="M291.0,900 V521.1 a4,4 0 0 1 4,-4 H437.0 a4,4 0 0 1 4,4 V900 Z" fill="#6D4AE8"/><text x="366.0" y="557.1" text-anchor="middle" font-size="22" font-weight="600" fill="#fff">1.3× Xeon 6</text><path d="M366.0,518.9 V515.3 M352.0,518.9 H380.0 M352.0,515.3 H380.0" stroke="#15123C" stroke-width="2.5" fill="none"/><text x="366.0" y="501.3" text-anchor="middle" class="v">239k</text><path d="M453.0,900 V606.9 a4,4 0 0 1 4,-4 H599.0 a4,4 0 0 1 4,4 V900 Z" fill="#0e9f9a"/><text x="528.0" y="642.9" text-anchor="middle" font-size="22" font-weight="600" fill="#fff">≈ Xeon 6</text><path d="M528.0,603.4 V602.3 M514.0,603.4 H542.0 M514.0,602.3 H542.0" stroke="#15123C" stroke-width="2.5" fill="none"/><text x="528.0" y="588.3" text-anchor="middle" class="v">185k</text><path d="M615.0,900 V606.9 a4,4 0 0 1 4,-4 H761.0 a4,4 0 0 1 4,4 V900 Z" fill="#1f6fe5"/><path d="M690.0,603.4 V602.3 M676.0,603.4 H704.0 M676.0,602.3 H704.0" stroke="#15123C" stroke-width="2.5" fill="none"/><text x="690.0" y="588.3" text-anchor="middle" class="v">185k</text><text x="528.0" y="948" text-anchor="middle" class="lab">Sin ajustes</text><path d="M1155.0,900 V520.2 a4,4 0 0 1 4,-4 H1301.0 a4,4 0 0 1 4,4 V900 Z" fill="#6D4AE8"/><text x="1230.0" y="556.2" text-anchor="middle" font-size="22" font-weight="600" fill="#fff">1.3× Xeon 6</text><path d="M1230.0,517.1 V515.3 M1216.0,517.1 H1244.0 M1216.0,515.3 H1244.0" stroke="#15123C" stroke-width="2.5" fill="none"/><text x="1230.0" y="501.3" text-anchor="middle" class="v">239k</text><path d="M1317.0,900 V607.8 a4,4 0 0 1 4,-4 H1463.0 a4,4 0 0 1 4,4 V900 Z" fill="#0e9f9a"/><text x="1392.0" y="643.8" text-anchor="middle" font-size="22" font-weight="600" fill="#fff">≈ Xeon 6</text><path d="M1392.0,612.0 V595.6 M1378.0,612.0 H1406.0 M1378.0,595.6 H1406.0" stroke="#15123C" stroke-width="2.5" fill="none"/><text x="1392.0" y="581.6" text-anchor="middle" class="v">185k</text><path d="M1479.0,900 V598.6 a4,4 0 0 1 4,-4 H1625.0 a4,4 0 0 1 4,4 V900 Z" fill="#1f6fe5"/><path d="M1554.0,598.4 V590.9 M1540.0,598.4 H1568.0 M1540.0,590.9 H1568.0" stroke="#15123C" stroke-width="2.5" fill="none"/><text x="1554.0" y="576.9" text-anchor="middle" class="v">190k</text><text x="1392.0" y="948" text-anchor="middle" class="lab">Con ajustes (páginas grandes)</text><text x="96" y="990" class="src">Fuente: lab propio, Task 7, 2 días × 3 runs; barra = media de los 2 días, línea = mín–máx entre días</text></svg>
