<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">
<title>Red: Graviton5 gasta un tercio de la CPU de Xeon 6 por Gbps</title>
<defs>
<linearGradient id="tv-grad-h" gradientUnits="userSpaceOnUse" x1="96" y1="0" x2="1824" y2="0"><stop offset="0" stop-color="#4C2FC9"/><stop offset=".5" stop-color="#6D4AE8"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
<radialGradient id="tv-glow-a"><stop offset="0" stop-color="#A78BFA" stop-opacity=".16"/><stop offset=".45" stop-color="#6D4AE8" stop-opacity=".08"/><stop offset="1" stop-color="#6D4AE8" stop-opacity="0"/></radialGradient>
<radialGradient id="tv-glow-b"><stop offset="0" stop-color="#6D4AE8" stop-opacity=".10"/><stop offset="1" stop-color="#6D4AE8" stop-opacity="0"/></radialGradient>
</defs>
<style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=Montserrat:wght@600;700&amp;family=JetBrains+Mono&amp;display=block');
.k{font:26px 'JetBrains Mono',Menlo,monospace;fill:#15123C}
.h{font-family:Montserrat,Inter,sans-serif;font-size:50px;font-weight:700;fill:#15123C}
.sub{font-size:26px;fill:#5E5A80}
.v{font-size:28px;font-weight:600;fill:#15123C}
.lab{font-size:28px;font-weight:600;fill:#15123C}
.c{font-size:24px;fill:#5E5A80}
.src{font-size:24px;fill:#5E5A80}
</style>
<rect width="1920" height="1080" fill="#ffffff"/>
<circle cx="1860" cy="40" r="820" fill="url(#tv-glow-a)"/><circle cx="60" cy="1060" r="760" fill="url(#tv-glow-b)"/>
<text x="96" y="74" class="k"><tspan fill="#6D4AE8">[</tspan>RED<tspan fill="#6D4AE8">]</tspan></text><text x="96" y="140" class="h">Red: Graviton5 gasta un tercio de la CPU de Xeon 6 por Gbps</text><text x="96" y="192" class="sub">Núcleos de CPU que gasta el nodo por cada Gbps recibido (iperf3, 8 flujos); más bajo = mejor; % frente a Xeon 6</text><text x="96" y="228" class="sub">Los Gbps los pone la instancia, no el chip; los ajustes de latencia no sumaron Gbps y sí CPU</text><rect x="96" y="266" width="24" height="24" rx="4" fill="#6D4AE8"/><text x="132" y="286" class="c">Graviton5 (m9g)</text><rect x="368" y="266" width="24" height="24" rx="4" fill="#0e9f9a"/><text x="404" y="286" class="c">EPYC (m8a)</text><rect x="580" y="266" width="24" height="24" rx="4" fill="#1f6fe5"/><text x="616" y="286" class="c">Xeon 6 (m8i)</text><rect x="96" y="314" width="1728" height="92" rx="14" fill="#F6F4FE" stroke="#DCD6F7" stroke-width="1.5"/><text x="124" y="351" font-family="JetBrains Mono,Menlo,monospace" font-size="20" fill="#6D4AE8">CONFIG</text><text x="264" y="351" font-size="22" fill="#15123C">iperf3, 8 flujos TCP, 60 s por sentido, entre dos nodos del mismo tipo · los Gbps los limita la instancia</text><text x="124" y="387" font-family="JetBrains Mono,Menlo,monospace" font-size="20" fill="#6D4AE8">POR QUÉ</text><text x="264" y="387" font-size="22" fill="#15123C">Graviton5 y EPYC reciben tráfico a un costo parecido; Xeon paga 2–3×, probablemente porque sus 16 vCPU son 8 núcleos con SMT</text><line x1="96" x2="1824" y1="900" y2="900" stroke="#DCD6F7" stroke-width="2"/><path d="M291.0,900 V803.9 a4,4 0 0 1 4,-4 H437.0 a4,4 0 0 1 4,4 V900 Z" fill="#6D4AE8"/><text x="366.0" y="839.9" text-anchor="middle" font-size="22" font-weight="600" fill="#fff">67 % menos</text><text x="366.0" y="785.9" text-anchor="middle" class="v">0.029</text><path d="M453.0,900 V775.7 a4,4 0 0 1 4,-4 H599.0 a4,4 0 0 1 4,4 V900 Z" fill="#0e9f9a"/><text x="528.0" y="811.7" text-anchor="middle" font-size="22" font-weight="600" fill="#fff">58 % menos</text><text x="528.0" y="757.7" text-anchor="middle" class="v">0.037</text><path d="M615.0,900 V597.3 a4,4 0 0 1 4,-4 H761.0 a4,4 0 0 1 4,4 V900 Z" fill="#1f6fe5"/><text x="690.0" y="579.3" text-anchor="middle" class="v">0.088</text><text x="528.0" y="948" text-anchor="middle" class="lab">Sin ajustes</text><path d="M1155.0,900 V679.6 a4,4 0 0 1 4,-4 H1301.0 a4,4 0 0 1 4,4 V900 Z" fill="#6D4AE8"/><text x="1230.0" y="715.6" text-anchor="middle" font-size="22" font-weight="600" fill="#fff">39 % menos</text><text x="1230.0" y="661.6" text-anchor="middle" class="v">0.064</text><path d="M1317.0,900 V629.2 a4,4 0 0 1 4,-4 H1463.0 a4,4 0 0 1 4,4 V900 Z" fill="#0e9f9a"/><text x="1392.0" y="665.2" text-anchor="middle" font-size="22" font-weight="600" fill="#fff">25 % menos</text><text x="1392.0" y="611.2" text-anchor="middle" class="v">0.079</text><path d="M1479.0,900 V535.4 a4,4 0 0 1 4,-4 H1625.0 a4,4 0 0 1 4,4 V900 Z" fill="#1f6fe5"/><text x="1554.0" y="517.4" text-anchor="middle" class="v">0.106</text><text x="1392.0" y="948" text-anchor="middle" class="lab">Con ajustes de latencia (IRQ fijas)</text><text x="96" y="990" class="src">Fuente: lab propio, Task 7 día 2 (un solo día, 3 runs); throughput 16.9 Gbps m9g, 14.9 m8a y m8i</text></svg>
