<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">
<title>Siete workloads</title>
<defs>
<linearGradient id="tv-grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4C2FC9"/><stop offset=".5" stop-color="#6D4AE8"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
<linearGradient id="tv-grad-h" gradientUnits="userSpaceOnUse" x1="96" y1="0" x2="1824" y2="0"><stop offset="0" stop-color="#4C2FC9"/><stop offset=".5" stop-color="#6D4AE8"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
<radialGradient id="tv-glow-a"><stop offset="0" stop-color="#A78BFA" stop-opacity=".16"/><stop offset=".45" stop-color="#6D4AE8" stop-opacity=".08"/><stop offset="1" stop-color="#6D4AE8" stop-opacity="0"/></radialGradient>
<radialGradient id="tv-glow-b"><stop offset="0" stop-color="#6D4AE8" stop-opacity=".10"/><stop offset="1" stop-color="#6D4AE8" stop-opacity="0"/></radialGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#15123C" flood-opacity=".07"/></filter>
</defs>
<style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=Montserrat:wght@600;700&amp;family=JetBrains+Mono&amp;display=block');
.k{font:26px 'JetBrains Mono',Menlo,monospace;fill:#15123C}
.h{font-family:Montserrat,Inter,sans-serif;font-size:52px;font-weight:700;fill:#15123C}
.sub{font-size:26px;fill:#5E5A80}
.t{font-size:30px;font-weight:600;fill:#15123C}
.c{font-size:24px;fill:#5E5A80}
.m{font:24px 'JetBrains Mono',Menlo,monospace;fill:#15123C}
.card{fill:#fff;stroke:#DCD6F7;stroke-width:1.5;filter:url(#sh)}
.act{fill:none;stroke:url(#tv-grad);stroke-width:3;filter:drop-shadow(0 0 18px rgb(109 74 232 / .35))}
.idle{fill:none;stroke:#DCD6F7;stroke-width:3;stroke-dasharray:6 6}
.on{fill:none;stroke:#6D4AE8;stroke-width:3}
.dot{fill:#6D4AE8;stroke:#fff;stroke-width:3;filter:drop-shadow(0 0 8px rgb(109 74 232 / .6))}
.gl{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.big{font-size:30px;font-weight:600;fill:#15123C}.lbl{font:24px 'JetBrains Mono',Menlo,monospace;fill:#6D4AE8}.pc{fill:#fff4e5;stroke:#d97706;stroke-width:2;stroke-dasharray:8 6}.pct{font:24px 'JetBrains Mono',Menlo,monospace;fill:#b45309}@media (prefers-reduced-motion: no-preference){@keyframes in{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}.in{animation:in .7s cubic-bezier(.2,.7,.2,1) both}}
</style>
<rect width="1920" height="1080" fill="#fff"/><circle cx="1860" cy="40" r="820" fill="url(#tv-glow-a)"/><circle cx="60" cy="1060" r="760" fill="url(#tv-glow-b)"/>
<text x="96" y="74" class="k"><tspan fill="#6D4AE8">[</tspan>WORKLOADS<tspan fill="#6D4AE8">]</tspan></text>
<text x="96" y="140" class="h">Siete workloads, cada uno exige algo distinto</text>
<text x="96" y="192" class="sub">Los mismos siete en Intel, AMD y Graviton5; primero, los cinco con SLO de latencia</text>
<g class="in" style="animation-delay:0.30s"><rect x="96.0" y="250" width="329.6" height="640" rx="20" class="card"/><text x="120.0" y="312" class="t">Java + vthreads</text><text x="120.0" y="374" class="lbl">QUÉ ES</text><text x="120.0" y="414" class="c">Spring REST (PetClinic)</text><text x="120.0" y="448" class="c">en JDK 25, con ajustes</text><text x="120.0" y="482" class="c">y virtual threads</text><text x="120.0" y="540" class="lbl">QUÉ EXIGE</text><text x="120.0" y="580" class="c">muchas peticiones</text><text x="120.0" y="614" class="c">simultáneas: uso de</text><text x="120.0" y="648" class="c">CPU y coordinación</text><text x="120.0" y="682" class="c">entre hilos</text><path d="M120.0 710 H401.6" stroke="#DCD6F7" stroke-width="1.5"/><text x="120.0" y="755" class="lbl">CÓMO SE MIDE</text><text x="120.0" y="795" class="c">peticiones por segundo</text><text x="120.0" y="829" class="c">con el 99 % en &lt; 10 ms</text></g>
<g class="in" style="animation-delay:0.65s"><rect x="445.6" y="250" width="329.6" height="640" rx="20" class="card"/><text x="469.6" y="312" class="t">Java tuned</text><text x="469.6" y="374" class="lbl">QUÉ ES</text><text x="469.6" y="414" class="c">Spring REST en JDK 25,</text><text x="469.6" y="448" class="c">con THP y flags de JVM</text><text x="469.6" y="482" class="c">elegidas por chip</text><text x="469.6" y="540" class="lbl">QUÉ EXIGE</text><text x="469.6" y="580" class="c">mucho código:</text><text x="469.6" y="614" class="c">qué tan rápido el</text><text x="469.6" y="648" class="c">núcleo lee y decodifica</text><text x="469.6" y="682" class="c">sus instrucciones</text><path d="M469.6 710 H751.2" stroke="#DCD6F7" stroke-width="1.5"/><text x="469.6" y="755" class="lbl">CÓMO SE MIDE</text><text x="469.6" y="795" class="c">peticiones por segundo</text><text x="469.6" y="829" class="c">con el 99 % en &lt; 10 ms</text></g>
<g class="in" style="animation-delay:1.00s"><rect x="795.2" y="250" width="329.6" height="640" rx="20" class="card"/><text x="819.2" y="312" class="t">Go</text><text x="819.2" y="374" class="lbl">QUÉ ES</text><text x="819.2" y="414" class="c">servicio HTTP de la</text><text x="819.2" y="448" class="c">librería estándar</text><text x="819.2" y="540" class="lbl">QUÉ EXIGE</text><text x="819.2" y="580" class="c">cálculo por petición,</text><text x="819.2" y="614" class="c">sin leer datos</text><text x="819.2" y="648" class="c">del disco</text><path d="M819.2 710 H1100.8000000000002" stroke="#DCD6F7" stroke-width="1.5"/><text x="819.2" y="755" class="lbl">CÓMO SE MIDE</text><text x="819.2" y="795" class="c">peticiones por segundo</text><text x="819.2" y="829" class="c">con el 99 % en &lt; 20 ms</text></g>
<g class="in" style="animation-delay:1.35s"><rect x="1144.8000000000002" y="250" width="329.6" height="640" rx="20" class="card"/><text x="1168.8000000000002" y="312" class="t">PostgreSQL</text><text x="1168.8000000000002" y="374" class="lbl">QUÉ ES</text><text x="1168.8000000000002" y="414" class="c">pgbench select-only,</text><text x="1168.8000000000002" y="448" class="c">escala 1000 (~17 GB)</text><text x="1168.8000000000002" y="540" class="lbl">QUÉ EXIGE</text><text x="1168.8000000000002" y="580" class="c">consultas cortas por</text><text x="1168.8000000000002" y="614" class="c">índice, con los datos</text><text x="1168.8000000000002" y="648" class="c">precargados en</text><text x="1168.8000000000002" y="682" class="c">memoria</text><path d="M1168.8000000000002 710 H1450.4" stroke="#DCD6F7" stroke-width="1.5"/><text x="1168.8000000000002" y="755" class="lbl">CÓMO SE MIDE</text><text x="1168.8000000000002" y="795" class="c">consultas por segundo</text><text x="1168.8000000000002" y="829" class="c">con el 99 % en &lt; 5 ms</text></g>
<g class="in" style="animation-delay:1.70s"><rect x="1494.4" y="250" width="329.6" height="640" rx="20" class="card"/><text x="1518.4" y="312" class="t">MongoDB</text><text x="1518.4" y="374" class="lbl">QUÉ ES</text><text x="1518.4" y="414" class="c">YCSB workload B</text><text x="1518.4" y="448" class="c">(95 % lecturas),</text><text x="1518.4" y="482" class="c">20 M registros</text><text x="1518.4" y="540" class="lbl">QUÉ EXIGE</text><text x="1518.4" y="580" class="c">lecturas en memoria:</text><text x="1518.4" y="614" class="c">qué tan rápido llegan</text><text x="1518.4" y="648" class="c">los datos al chip</text><text x="1518.4" y="682" class="c">(en caché a propósito)</text><path d="M1518.4 710 H1800.0" stroke="#DCD6F7" stroke-width="1.5"/><text x="1518.4" y="755" class="lbl">CÓMO SE MIDE</text><text x="1518.4" y="795" class="c">operaciones por</text><text x="1518.4" y="829" class="c">segundo; 99 % de las</text><text x="1518.4" y="863" class="c">lecturas en &lt; 5 ms</text></g>
<text x="96" y="990" class="c">Fuente: lab propio; versiones, datasets y SLO en analysis/facts-setup.md §3–§4</text>

</svg>
