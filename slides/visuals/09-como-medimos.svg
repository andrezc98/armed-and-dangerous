<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">
<title>Cómo medimos para comparar los tres</title>
<defs>
<linearGradient id="tv-grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4C2FC9"/><stop offset=".5" stop-color="#6D4AE8"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
<linearGradient id="tv-grad-h" gradientUnits="userSpaceOnUse" x1="96" y1="0" x2="1824" y2="0"><stop offset="0" stop-color="#4C2FC9"/><stop offset=".5" stop-color="#6D4AE8"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
<radialGradient id="tv-glow-a"><stop offset="0" stop-color="#A78BFA" stop-opacity=".16"/><stop offset=".45" stop-color="#6D4AE8" stop-opacity=".08"/><stop offset="1" stop-color="#6D4AE8" stop-opacity="0"/></radialGradient>
<radialGradient id="tv-glow-b"><stop offset="0" stop-color="#6D4AE8" stop-opacity=".10"/><stop offset="1" stop-color="#6D4AE8" stop-opacity="0"/></radialGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#15123C" flood-opacity=".07"/></filter>
</defs>
<style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=Montserrat:wght@600;700&amp;family=JetBrains+Mono&amp;display=block');
.k{font:26px 'JetBrains Mono',Menlo,monospace;fill:#15123C}
.h{font-family:Montserrat,Inter,sans-serif;font-size:52px;font-weight:700;fill:#15123C}
.sub{font-size:26px;fill:#5E5A80}
.t{font-size:30px;font-weight:600;fill:#15123C}
.c{font-size:24px;fill:#5E5A80}
.m{font:24px 'JetBrains Mono',Menlo,monospace;fill:#15123C}
.card{fill:#fff;stroke:#DCD6F7;stroke-width:1.5;filter:url(#sh)}
.act{fill:none;stroke:url(#tv-grad);stroke-width:3;filter:drop-shadow(0 0 18px rgb(109 74 232 / .35))}
.idle{fill:none;stroke:#DCD6F7;stroke-width:3;stroke-dasharray:6 6}
.on{fill:none;stroke:#6D4AE8;stroke-width:3}
.dot{fill:#6D4AE8;stroke:#fff;stroke-width:3;filter:drop-shadow(0 0 8px rgb(109 74 232 / .6))}
.gl{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.big{font-size:30px;font-weight:600;fill:#15123C}.lbl{font:24px 'JetBrains Mono',Menlo,monospace;fill:#6D4AE8}.pc{fill:#fff4e5;stroke:#d97706;stroke-width:2;stroke-dasharray:8 6}.pct{font:24px 'JetBrains Mono',Menlo,monospace;fill:#b45309}@media (prefers-reduced-motion: no-preference){@keyframes in{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}.in{animation:in .7s cubic-bezier(.2,.7,.2,1) both}}
</style>
<rect width="1920" height="1080" fill="#fff"/><circle cx="1860" cy="40" r="820" fill="url(#tv-glow-a)"/><circle cx="60" cy="1060" r="760" fill="url(#tv-glow-b)"/>
<text x="96" y="74" class="k"><tspan fill="#6D4AE8">[</tspan>MÉTODO<tspan fill="#6D4AE8">]</tspan></text>
<text x="96" y="140" class="h">Cómo medimos para comparar los tres</text>
<text x="96" y="192" class="sub">Las reglas para comparar los siete workloads</text>
<g class="in" style="animation-delay:0.30s"><rect x="96" y="240" width="1728" height="110" rx="20" class="card"/><text x="136" y="316" font-size="60" font-weight="700" fill="url(#tv-grad-h)">2 × 3</text><text x="560" y="288" class="t">3 runs de 8 minutos por día, durante 2 días</text><text x="560" y="326" class="c">instancias distintas cada día · inferencia: runs de 6 min · red: un día, 60 s por sentido</text></g>
<g class="in" style="animation-delay:0.65s"><rect x="96" y="370" width="1728" height="110" rx="20" class="card"/><text x="136" y="446" font-size="60" font-weight="700" fill="url(#tv-grad-h)">15 vCPU</text><text x="560" y="418" class="t">asignadas en exclusiva al pod de la app</text><text x="560" y="456" class="c">el runner verifica las 15 vCPU antes de medir; si faltan, aborta la prueba</text></g>
<g class="in" style="animation-delay:1.00s"><rect x="96" y="500" width="1728" height="110" rx="20" class="card"/><text x="136" y="576" font-size="60" font-weight="700" fill="url(#tv-grad-h)">≤ 70 %</text><text x="560" y="548" class="t">el loader corre en su propia instancia (c8i.16xlarge)</text><text x="560" y="586" class="c">si pasa del 70 % de CPU, el run se descarta; en red, el tráfico sale de otro nodo igual</text></g>
<g class="in" style="animation-delay:1.35s"><rect x="96" y="630" width="1728" height="110" rx="20" class="card"/><text x="136" y="700" font-size="40" font-weight="700" fill="url(#tv-grad-h)">punto de quiebre</text><text x="560" y="678" class="t">la mayor carga medida que cumple el SLO de p99</text><text x="560" y="716" class="c">10 ms Java · 20 ms Go · 5 ms PostgreSQL y MongoDB; inferencia y red no tienen SLO</text></g>
<g class="in" style="animation-delay:1.70s"><rect x="96" y="760" width="1728" height="110" rx="20" class="card"/><text x="136" y="836" font-size="60" font-weight="700" fill="url(#tv-grad-h)">30 / 30</text><text x="560" y="808" class="t">pruebas válidas el día 3</text><text x="560" y="846" class="c">prueba = un workload en un chip con una configuración; ningún run inválido</text></g>
<text x="96" y="990" class="c">Fuente: lab propio, Task 7 (25 al 28-09-2026); analysis/facts-setup.md §1.4 y §4</text>

</svg>
