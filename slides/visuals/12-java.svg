<text x="96" y="74" class="k"><tspan fill="#6D4AE8">[</tspan>JAVA<tspan fill="#6D4AE8">]</tspan></text><text x="96" y="140" class="h">Java: Graviton5 y EPYC atienden 1.7–2× lo que Xeon 6</text><text x="96" y="192" class="sub">Spring REST: peticiones por segundo con el 99 % en menos de 10 ms; más alto = mejor</text><text x="96" y="228" class="sub">Sin ajustes, EPYC atiende 11 % más que Graviton5; con ajustes, empatan</text><rect x="96" y="266" width="24" height="24" rx="4" fill="#6D4AE8"/><text x="132" y="286" class="c">Graviton5 (m9g)</text><rect x="368" y="266" width="24" height="24" rx="4" fill="#0e9f9a"/><text x="404" y="286" class="c">EPYC (m8a)</text><rect x="580" y="266" width="24" height="24" rx="4" fill="#1f6fe5"/><text x="616" y="286" class="c">Xeon 6 (m8i)</text><rect x="96" y="314" width="1728" height="92" rx="14" fill="#F6F4FE" stroke="#DCD6F7" stroke-width="1.5"/><text x="124" y="351" font-family="JetBrains Mono,Menlo,monospace" font-size="20" fill="#6D4AE8">CONFIG</text><text x="264" y="351" font-size="22" fill="#15123C">PetClinic REST, base H2 en memoria, heap de 24 GB · k6 sube de 10 mil en 10 mil hasta 120 mil peticiones/s</text><text x="124" y="387" font-family="JetBrains Mono,Menlo,monospace" font-size="20" fill="#6D4AE8">POR QUÉ</text><text x="264" y="387" font-size="22" fill="#15123C">EPYC y Graviton5 hacen más trabajo por ciclo (IPC 1.35 y 1.25 contra 0.93) y tienen 16 núcleos reales; Xeon, 8 con SMT</text><line x1="96" x2="1824" y1="900" y2="900" stroke="#DCD6F7" stroke-width="2"/><path d="M147.0,900 V624.2 a4,4 0 0 1 4,-4 H293.0 a4,4 0 0 1 4,4 V900 Z" fill="#6D4AE8"/><text x="222.0" y="660.2" text-anchor="middle" font-size="22" font-weight="600" fill="#fff">1.7× Xeon 6</text><path d="M222.0,620.2 V620.2 M208.0,620.2 H236.0 M208.0,620.2 H236.0" stroke="#15123C" stroke-width="2.5" fill="none"/><text x="222.0" y="606.2" text-anchor="middle" class="v">80k</text><path d="M309.0,900 V592.7 a4,4 0 0 1 4,-4 H455.0 a4,4 0 0 1 4,4 V900 Z" fill="#0e9f9a"/><text x="384.0" y="628.7" text-anchor="middle" font-size="22" font-weight="600" fill="#fff">1.9× Xeon 6</text><path d="M384.0,592.2 V585.2 M370.0,592.2 H398.0 M370.0,585.2 H398.0" stroke="#15123C" stroke-width="2.5" fill="none"/><text x="384.0" y="571.2" text-anchor="middle" class="v">89k</text><path d="M471.0,900 V743.1 a4,4 0 0 1 4,-4 H617.0 a4,4 0 0 1 4,4 V900 Z" fill="#1f6fe5"/><path d="M546.0,739.1 V739.1 M532.0,739.1 H560.0 M532.0,739.1 H560.0" stroke="#15123C" stroke-width="2.5" fill="none"/><text x="546.0" y="725.1" text-anchor="middle" class="v">46k</text><text x="384.0" y="948" text-anchor="middle" class="lab">Sin ajustes</text><path d="M723.0,900 V596.2 a4,4 0 0 1 4,-4 H869.0 a4,4 0 0 1 4,4 V900 Z" fill="#6D4AE8"/><text x="798.0" y="632.2" text-anchor="middle" font-size="22" font-weight="600" fill="#fff">1.7× Xeon 6</text><path d="M798.0,599.2 V585.2 M784.0,599.2 H812.0 M784.0,585.2 H812.0" stroke="#15123C" stroke-width="2.5" fill="none"/><text x="798.0" y="571.2" text-anchor="middle" class="v">88k</text><path d="M885.0,900 V589.2 a4,4 0 0 1 4,-4 H1031.0 a4,4 0 0 1 4,4 V900 Z" fill="#0e9f9a"/><text x="960.0" y="625.2" text-anchor="middle" font-size="22" font-weight="600" fill="#fff">1.7× Xeon 6</text><path d="M960.0,585.2 V585.2 M946.0,585.2 H974.0 M946.0,585.2 H974.0" stroke="#15123C" stroke-width="2.5" fill="none"/><text x="960.0" y="571.2" text-anchor="middle" class="v">90k</text><path d="M1047.0,900 V718.6 a4,4 0 0 1 4,-4 H1193.0 a4,4 0 0 1 4,4 V900 Z" fill="#1f6fe5"/><path d="M1122.0,718.1 V711.1 M1108.0,718.1 H1136.0 M1108.0,711.1 H1136.0" stroke="#15123C" stroke-width="2.5" fill="none"/><text x="1122.0" y="697.1" text-anchor="middle" class="v">53k</text><text x="960.0" y="948" text-anchor="middle" class="lab">Con ajustes (páginas grandes + JVM)</text><path d="M1299.0,900 V522.8 a4,4 0 0 1 4,-4 H1445.0 a4,4 0 0 1 4,4 V900 Z" fill="#6D4AE8"/><text x="1374.0" y="558.8" text-anchor="middle" font-size="22" font-weight="600" fill="#fff">1.9× Xeon 6</text><path d="M1374.0,522.2 V515.3 M1360.0,522.2 H1388.0 M1360.0,515.3 H1388.0" stroke="#15123C" stroke-width="2.5" fill="none"/><text x="1374.0" y="501.3" text-anchor="middle" class="v">109k</text><path d="M1461.0,900 V522.8 a4,4 0 0 1 4,-4 H1607.0 a4,4 0 0 1 4,4 V900 Z" fill="#0e9f9a"/><text x="1536.0" y="558.8" text-anchor="middle" font-size="22" font-weight="600" fill="#fff">1.9× Xeon 6</text><path d="M1536.0,522.2 V515.3 M1522.0,522.2 H1550.0 M1522.0,515.3 H1550.0" stroke="#15123C" stroke-width="2.5" fill="none"/><text x="1536.0" y="501.3" text-anchor="middle" class="v">109k</text><path d="M1623.0,900 V708.1 a4,4 0 0 1 4,-4 H1769.0 a4,4 0 0 1 4,4 V900 Z" fill="#1f6fe5"/><path d="M1698.0,704.1 V704.1 M1684.0,704.1 H1712.0 M1684.0,704.1 H1712.0" stroke="#15123C" stroke-width="2.5" fill="none"/><text x="1698.0" y="690.1" text-anchor="middle" class="v">56k</text><text x="1536.0" y="948" text-anchor="middle" class="lab">Con ajustes + virtual threads</text><text x="96" y="990" class="src">Fuente: lab propio, Task 7, 2 días × 3 runs; barra = media de los 2 días, línea = mín–máx entre días</text></svg>
