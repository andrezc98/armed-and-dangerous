<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">
<title>PostgreSQL: aquí gana EPYC; Graviton5 empata con Xeon 6</title>
<defs>
<linearGradient id="tv-grad-h" gradientUnits="userSpaceOnUse" x1="96" y1="0" x2="1824" y2="0"><stop offset="0" stop-color="#4C2FC9"/><stop offset=".5" stop-color="#6D4AE8"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
<radialGradient id="tv-glow-a"><stop offset="0" stop-color="#A78BFA" stop-opacity=".16"/><stop offset=".45" stop-color="#6D4AE8" stop-opacity=".08"/><stop offset="1" stop-color="#6D4AE8" stop-opacity="0"/></radialGradient>
<radialGradient id="tv-glow-b"><stop offset="0" stop-color="#6D4AE8" stop-opacity=".10"/><stop offset="1" stop-color="#6D4AE8" stop-opacity="0"/></radialGradient>
</defs>
<style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=Montserrat:wght@600;700&amp;family=JetBrains+Mono&amp;display=block');
.k{font:26px 'JetBrains Mono',Menlo,monospace;fill:#15123C}
.h{font-family:Montserrat,Inter,sans-serif;font-size:50px;font-weight:700;fill:#15123C}
.sub{font-size:26px;fill:#5E5A80}
.v{font-size:28px;font-weight:600;fill:#15123C}
.lab{font-size:28px;font-weight:600;fill:#15123C}
.c{font-size:24px;fill:#5E5A80}
.src{font-size:24px;fill:#5E5A80}
</style>
<rect width="1920" height="1080" fill="#ffffff"/>
<circle cx="1860" cy="40" r="820" fill="url(#tv-glow-a)"/><circle cx="60" cy="1060" r="760" fill="url(#tv-glow-b)"/>
<text x="96" y="74" class="k"><tspan fill="#6D4AE8">[</tspan>POSTGRESQL<tspan fill="#6D4AE8">]</tspan></text><text x="96" y="140" class="h">PostgreSQL: aquí gana EPYC; Graviton5 empata con Xeon 6</text><text x="96" y="192" class="sub">Transacciones por segundo (una lectura por índice cada una), con el 99 % en menos de 5 ms; más alto = mejor</text><text x="96" y="228" class="sub">Con ajustes y precios on-demand, por dólar EPYC rinde 1.52× el Xeon 6; Graviton5, 1.06×</text><rect x="96" y="266" width="24" height="24" rx="4" fill="#6D4AE8"/><text x="132" y="286" class="c">Graviton5 (m9g)</text><rect x="368" y="266" width="24" height="24" rx="4" fill="#0e9f9a"/><text x="404" y="286" class="c">EPYC (m8a)</text><rect x="580" y="266" width="24" height="24" rx="4" fill="#1f6fe5"/><text x="616" y="286" class="c">Xeon 6 (m8i)</text><rect x="96" y="314" width="1728" height="92" rx="14" fill="#F6F4FE" stroke="#DCD6F7" stroke-width="1.5"/><text x="124" y="351" font-family="JetBrains Mono,Menlo,monospace" font-size="20" fill="#6D4AE8">CONFIG</text><text x="264" y="351" font-size="22" fill="#15123C">pgbench solo lectura, 100 M filas (~17 GB) en memoria · de 16 a 512 clientes · quiebre en 128–256 clientes, p99 ≈ 0.6 ms</text><text x="124" y="387" font-family="JetBrains Mono,Menlo,monospace" font-size="20" fill="#6D4AE8">POR QUÉ</text><text x="264" y="387" font-size="22" fill="#15123C">EPYC y Graviton5 hacen el mismo trabajo por ciclo (IPC 1.00 y 1.04), pero EPYC va a 4.5 GHz contra 3.3: explica ~1.35× de 1.8×</text><line x1="96" x2="1824" y1="900" y2="900" stroke="#DCD6F7" stroke-width="2"/><path d="M291.0,900 V727.7 a4,4 0 0 1 4,-4 H437.0 a4,4 0 0 1 4,4 V900 Z" fill="#6D4AE8"/><text x="366.0" y="763.7" text-anchor="middle" font-size="22" font-weight="600" fill="#fff">≈ Xeon 6</text><path d="M366.0,723.9 V723.6 M352.0,723.9 H380.0 M352.0,723.6 H380.0" stroke="#15123C" stroke-width="2.5" fill="none"/><text x="366.0" y="709.6" text-anchor="middle" class="v">277k</text><path d="M453.0,900 V586.4 a4,4 0 0 1 4,-4 H599.0 a4,4 0 0 1 4,4 V900 Z" fill="#0e9f9a"/><text x="528.0" y="622.4" text-anchor="middle" font-size="22" font-weight="600" fill="#fff">1.8× Xeon 6</text><path d="M528.0,583.8 V580.9 M514.0,583.8 H542.0 M514.0,580.9 H542.0" stroke="#15123C" stroke-width="2.5" fill="none"/><text x="528.0" y="566.9" text-anchor="middle" class="v">499k</text><path d="M615.0,900 V729.4 a4,4 0 0 1 4,-4 H761.0 a4,4 0 0 1 4,4 V900 Z" fill="#1f6fe5"/><path d="M690.0,728.9 V721.9 M676.0,728.9 H704.0 M676.0,721.9 H704.0" stroke="#15123C" stroke-width="2.5" fill="none"/><text x="690.0" y="707.9" text-anchor="middle" class="v">274k</text><text x="528.0" y="948" text-anchor="middle" class="lab">Sin ajustes</text><path d="M1155.0,900 V690.8 a4,4 0 0 1 4,-4 H1301.0 a4,4 0 0 1 4,4 V900 Z" fill="#6D4AE8"/><text x="1230.0" y="726.8" text-anchor="middle" font-size="22" font-weight="600" fill="#fff">≈ Xeon 6</text><path d="M1230.0,688.8 V684.7 M1216.0,688.8 H1244.0 M1216.0,684.7 H1244.0" stroke="#15123C" stroke-width="2.5" fill="none"/><text x="1230.0" y="670.7" text-anchor="middle" class="v">335k</text><path d="M1317.0,900 V525.9 a4,4 0 0 1 4,-4 H1463.0 a4,4 0 0 1 4,4 V900 Z" fill="#0e9f9a"/><text x="1392.0" y="561.9" text-anchor="middle" font-size="22" font-weight="600" fill="#fff">1.7× Xeon 6</text><path d="M1392.0,528.5 V515.3 M1378.0,528.5 H1406.0 M1378.0,515.3 H1406.0" stroke="#15123C" stroke-width="2.5" fill="none"/><text x="1392.0" y="501.3" text-anchor="middle" class="v">594k</text><path d="M1479.0,900 V687.4 a4,4 0 0 1 4,-4 H1625.0 a4,4 0 0 1 4,4 V900 Z" fill="#1f6fe5"/><path d="M1554.0,686.2 V680.6 M1540.0,686.2 H1568.0 M1540.0,680.6 H1568.0" stroke="#15123C" stroke-width="2.5" fill="none"/><text x="1554.0" y="666.6" text-anchor="middle" class="v">340k</text><text x="1392.0" y="948" text-anchor="middle" class="lab">Con ajustes (16 GB de buffers + páginas grandes)</text><text x="96" y="990" class="src">Fuente: lab propio, Task 7, 2 días × 3 runs; barra = media de los 2 días, línea = mín–máx entre días</text></svg>
