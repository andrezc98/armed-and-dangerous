<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">
<title>¿Precio? Más trabajo por cada dólar</title>
<defs>
<linearGradient id="tv-grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4C2FC9"/><stop offset=".5" stop-color="#6D4AE8"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
<linearGradient id="tv-grad-h" gradientUnits="userSpaceOnUse" x1="96" y1="0" x2="1824" y2="0"><stop offset="0" stop-color="#4C2FC9"/><stop offset=".5" stop-color="#6D4AE8"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
<radialGradient id="tv-glow-a"><stop offset="0" stop-color="#A78BFA" stop-opacity=".16"/><stop offset=".45" stop-color="#6D4AE8" stop-opacity=".08"/><stop offset="1" stop-color="#6D4AE8" stop-opacity="0"/></radialGradient>
<radialGradient id="tv-glow-b"><stop offset="0" stop-color="#6D4AE8" stop-opacity=".10"/><stop offset="1" stop-color="#6D4AE8" stop-opacity="0"/></radialGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#15123C" flood-opacity=".07"/></filter>
</defs>
<style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=Montserrat:wght@600;700&amp;family=JetBrains+Mono&amp;display=block');
.k{font:26px 'JetBrains Mono',Menlo,monospace;fill:#15123C}
.h{font-family:Montserrat,Inter,sans-serif;font-size:52px;font-weight:700;fill:#15123C}
.sub{font-size:26px;fill:#5E5A80}
.t{font-size:30px;font-weight:600;fill:#15123C}
.c{font-size:24px;fill:#5E5A80}
.m{font:24px 'JetBrains Mono',Menlo,monospace;fill:#15123C}
.card{fill:#fff;stroke:#DCD6F7;stroke-width:1.5;filter:url(#sh)}
.act{fill:none;stroke:url(#tv-grad);stroke-width:3;filter:drop-shadow(0 0 18px rgb(109 74 232 / .35))}
.idle{fill:none;stroke:#DCD6F7;stroke-width:3;stroke-dasharray:6 6}
.on{fill:none;stroke:#6D4AE8;stroke-width:3}
.dot{fill:#6D4AE8;stroke:#fff;stroke-width:3;filter:drop-shadow(0 0 8px rgb(109 74 232 / .6))}
.gl{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.hero{font-family:Montserrat,Inter,sans-serif;font-weight:700;fill:url(#tv-grad-h)}.cap{font-size:32px;fill:#15123C}.src{font-size:24px;fill:#5E5A80}.tag{font:24px 'JetBrains Mono',Menlo,monospace;fill:#6D4AE8}.tm{font:24px 'JetBrains Mono',Menlo,monospace;fill:#e6e9ef;white-space:pre;font-variant-ligatures:none}.pc{fill:none;stroke:#d97706;stroke-width:3;stroke-dasharray:12 8}.pct{font:600 24px 'JetBrains Mono',Menlo,monospace;fill:#d97706}@media (prefers-reduced-motion: no-preference){.a{animation:in .7s cubic-bezier(.2,.7,.2,1) both}.ty{animation:ty .01s linear both}@keyframes in{from{opacity:0;transform:translateY(24px)}}@keyframes ty{from{opacity:0}}}
</style>
<rect width="1920" height="1080" fill="#fff"/><circle cx="1860" cy="40" r="820" fill="url(#tv-glow-a)"/><circle cx="60" cy="1060" r="760" fill="url(#tv-glow-b)"/>
<text x="96" y="74" class="k"><tspan fill="#6D4AE8">[</tspan>¿PRECIO?<tspan fill="#6D4AE8">]</tspan></text>
<text x="96" y="140" class="h">¿Precio? Más trabajo por cada dólar</text>
<text x="96" y="192" class="sub">Graviton5 (m9g) frente a Xeon 6 (m8i), mismo tamaño .4xlarge, on-demand us-east-1</text>
<g class="a" style="animation-delay:0.20s"><text x="84" y="520" font-size="250" class="hero">~2×</text></g>
<g class="a" style="animation-delay:0.60s"><text x="96" y="600" class="cap">por dólar en Go, Java e inferencia:</text><text x="96" y="642" class="cap">cerca de la mitad del costo por unidad de trabajo</text><text x="96" y="700" class="c">m9g cuesta 7.6 % menos por hora que m8i y además rinde más</text></g>
<g class="a" style="animation-delay:1.00s"><rect x="1000" y="226" width="824" height="84" rx="20" class="card"/><text x="1030" y="286" font-size="46" font-weight="700" fill="#6D4AE8">1.97×</text><text x="1220" y="264" font-size="28" font-weight="600" fill="#15123C">Go</text><text x="1220" y="294" class="c">sin ajustes</text></g>
<g class="a" style="animation-delay:1.18s"><rect x="1000" y="322" width="824" height="84" rx="20" class="card"/><text x="1030" y="382" font-size="46" font-weight="700" fill="#6D4AE8">2.11×</text><text x="1220" y="360" font-size="28" font-weight="600" fill="#15123C">Java</text><text x="1220" y="390" class="c">con ajustes + virtual threads (1.80× sin ellos)</text></g>
<g class="a" style="animation-delay:1.36s"><rect x="1000" y="418" width="824" height="84" rx="20" class="card"/><text x="1030" y="478" font-size="46" font-weight="700" fill="#6D4AE8">1.96×</text><text x="1220" y="456" font-size="28" font-weight="600" fill="#15123C">Inferencia</text><text x="1220" y="486" class="c">con ajustes; 2.36× sin ajustes</text></g>
<g class="a" style="animation-delay:1.54s"><rect x="1000" y="514" width="824" height="84" rx="20" class="card"/><text x="1030" y="574" font-size="46" font-weight="700" fill="#6D4AE8">1.36×</text><text x="1220" y="552" font-size="28" font-weight="600" fill="#15123C">MongoDB</text><text x="1220" y="582" class="c">con ajustes</text></g>
<g class="a" style="animation-delay:1.72s"><rect x="1000" y="610" width="824" height="84" rx="20" class="card"/><text x="1030" y="670" font-size="46" font-weight="700" fill="#5E5A80">1.06×</text><text x="1220" y="648" font-size="28" font-weight="600" fill="#15123C">PostgreSQL</text><text x="1220" y="678" class="c">aquí gana EPYC: 1.52× por dólar</text></g>
<g class="a" style="animation-delay:1.90s"><rect x="1000" y="706" width="824" height="84" rx="20" class="card"/><text x="1030" y="766" font-size="46" font-weight="700" fill="#6D4AE8">1.23×</text><text x="1220" y="744" font-size="28" font-weight="600" fill="#15123C">Red</text><text x="1220" y="774" class="c">Gbps por dólar; tope de la instancia, 1 día</text></g>
<g class="a" style="animation-delay:2.30s"><rect x="96" y="840" width="1728" height="104" rx="20" class="card"/><rect x="96" y="840" width="10" height="104" rx="5" fill="#0e9f9a"/><text x="136" y="882" font-size="28" font-weight="600" fill="#15123C">En Spot, EPYC supera a Graviton5 en Java sin ajustes</text><text x="136" y="920" class="c">Mediana semanal us-east-1: Java sin ajustes, EPYC 1.99× contra Graviton5 1.86×; Go, inferencia y MongoDB siguen con Graviton5</text></g>
<text x="96" y="1000" class="src">Fuente: medido en el lab, Task 7, 2 días × 3 runs (red: 1 día); precios on-demand y Spot: AWS Pricing API y EC2 API, us-east-1</text>

</svg>
