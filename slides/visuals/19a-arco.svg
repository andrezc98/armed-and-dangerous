<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">
<title>De Graviton4 a Graviton5, la misma app hizo el doble</title>
<defs>
<linearGradient id="tv-grad-h" gradientUnits="userSpaceOnUse" x1="96" y1="0" x2="1824" y2="0"><stop offset="0" stop-color="#4C2FC9"/><stop offset=".5" stop-color="#6D4AE8"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
<radialGradient id="tv-glow-a"><stop offset="0" stop-color="#A78BFA" stop-opacity=".16"/><stop offset=".45" stop-color="#6D4AE8" stop-opacity=".08"/><stop offset="1" stop-color="#6D4AE8" stop-opacity="0"/></radialGradient>
<radialGradient id="tv-glow-b"><stop offset="0" stop-color="#6D4AE8" stop-opacity=".10"/><stop offset="1" stop-color="#6D4AE8" stop-opacity="0"/></radialGradient>
</defs>
<style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=Montserrat:wght@600;700&amp;family=JetBrains+Mono&amp;display=block');
.k{font:26px 'JetBrains Mono',Menlo,monospace;fill:#15123C}
.h{font-family:Montserrat,Inter,sans-serif;font-size:50px;font-weight:700;fill:#15123C}
.sub{font-size:26px;fill:#5E5A80}
.v{font-size:28px;font-weight:600;fill:#15123C}
.lab{font-size:28px;font-weight:600;fill:#15123C}
.c{font-size:24px;fill:#5E5A80}
.src{font-size:24px;fill:#5E5A80}
</style>
<rect width="1920" height="1080" fill="#ffffff"/>
<circle cx="1860" cy="40" r="820" fill="url(#tv-glow-a)"/><circle cx="60" cy="1060" r="760" fill="url(#tv-glow-b)"/>
<text x="96" y="74" class="k"><tspan fill="#6D4AE8">[</tspan>ARCO GENERACIONAL<tspan fill="#6D4AE8">]</tspan></text><text x="96" y="140" class="h">De Graviton4 a Graviton5, la misma app hizo el doble</text><text x="96" y="192" class="sub">Java sin ajustes: peticiones por segundo en el punto de quiebre de cada familia .4xlarge; más largo = mejor</text><text x="96" y="228" class="sub">Intel creció 2× en cuatro generaciones (m5 → m8i); Graviton, 2× en una sola (m8g → m9g)</text><text x="96" y="330" font-size="30" font-weight="700" fill="#15123C">m5</text><text x="96" y="354" font-size="20" fill="#5E5A80">Intel Xeon</text><rect x="440" y="308" width="250.4" height="42" rx="6" fill="#1f6fe5"/><text x="708.4" y="338" font-size="26" font-weight="600" fill="#15123C">24 mil rps · 1.00× m5</text><text x="96" y="392" font-size="30" font-weight="700" fill="#15123C">m6i</text><text x="96" y="416" font-size="20" fill="#5E5A80">Intel Xeon</text><rect x="440" y="370" width="333.9" height="42" rx="6" fill="#1f6fe5"/><text x="791.9" y="400" font-size="26" font-weight="600" fill="#15123C">32 mil rps · 1.33× m5 · +33 % vs m5</text><text x="96" y="454" font-size="30" font-weight="700" fill="#15123C">m7i</text><text x="96" y="478" font-size="20" fill="#5E5A80">Intel Xeon</text><rect x="440" y="432" width="375.7" height="42" rx="6" fill="#1f6fe5"/><text x="833.7" y="462" font-size="26" font-weight="600" fill="#15123C">36 mil rps · 1.50× m5 · +13 % vs m6i</text><text x="96" y="516" font-size="30" font-weight="700" fill="#15123C">m8i</text><text x="96" y="540" font-size="20" fill="#5E5A80">Intel Xeon 6</text><rect x="440" y="494" width="500.9" height="42" rx="6" fill="#1f6fe5"/><text x="958.9" y="524" font-size="26" font-weight="600" fill="#15123C">48 mil rps · 2.00× m5 · +33 % vs m7i</text><text x="96" y="604" font-size="30" font-weight="700" fill="#15123C">m8a</text><text x="96" y="628" font-size="20" fill="#5E5A80">AMD EPYC 5.ª gen</text><rect x="440" y="582" width="939.1" height="42" rx="6" fill="#0e9f9a"/><text x="1397.1" y="612" font-size="26" font-weight="600" fill="#15123C">90 mil rps · 3.75× m5</text><text x="96" y="692" font-size="30" font-weight="700" fill="#15123C">m6g</text><text x="96" y="716" font-size="20" fill="#5E5A80">Graviton2</text><rect x="440" y="670" width="229.6" height="42" rx="6" fill="#6D4AE8"/><text x="687.6" y="700" font-size="26" font-weight="600" fill="#15123C">22 mil rps · 0.92× m5</text><text x="96" y="754" font-size="30" font-weight="700" fill="#15123C">m7g</text><text x="96" y="778" font-size="20" fill="#5E5A80">Graviton3</text><rect x="440" y="732" width="271.3" height="42" rx="6" fill="#6D4AE8"/><text x="729.3" y="762" font-size="26" font-weight="600" fill="#15123C">26 mil rps · 1.08× m5 · +18 % vs m6g</text><text x="96" y="816" font-size="30" font-weight="700" fill="#15123C">m8g</text><text x="96" y="840" font-size="20" fill="#5E5A80">Graviton4</text><rect x="440" y="794" width="417.4" height="42" rx="6" fill="#6D4AE8"/><text x="875.4" y="824" font-size="26" font-weight="600" fill="#15123C">40 mil rps · 1.67× m5 · +54 % vs m7g</text><text x="96" y="878" font-size="30" font-weight="700" fill="#15123C">m9g</text><text x="96" y="902" font-size="20" fill="#5E5A80">Graviton5</text><rect x="440" y="856" width="834.8" height="42" rx="6" fill="#6D4AE8"/><text x="1292.8" y="886" font-size="26" font-weight="600" fill="#15123C">80 mil rps · 3.33× m5 · +100 % vs m8g</text><text x="96" y="990" class="src">Fuente: lab propio, Task 8, 1 run por familia (m8g: 2 instancias, 40 mil rps cada una); orientativo</text></svg>
