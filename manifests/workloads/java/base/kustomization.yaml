apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aad

resources:
  - deployment.yaml
  - service.yaml

# No images: transformer here. The own image is named bare with a sentinel tag
# (aad-java:UNSET) so that nothing in git carries the sandbox account id; the
# runner adds the registry and the tag of the day through a throwaway
# kustomization at render time (runner/README.md).
