# The amd-tuned cell with virtual threads on, mirrors x86-tuned-vthreads.
# Stacks on the tuned overlay so everything else stays identical.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aad

resources:
  - ../amd-tuned

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: java
        namespace: aad
      spec:
        template:
          spec:
            containers:
              - name: java
                env:
                  - name: SPRING_THREADS_VIRTUAL_ENABLED
                    value: "true"
