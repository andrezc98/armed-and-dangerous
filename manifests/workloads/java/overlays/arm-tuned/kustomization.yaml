# Tuned cell: THP for heap and code cache, JIT without tiered compilation, code
# cache pinned at 64M (the CMP333 bundle, from
# https://github.com/aws/aws-graviton-getting-started/blob/main/java.md). Kept on
# Graviton because it measured best there on calibration day 2026-09-24 (n=1:
# 80k rps vs 70k with tiered on); x86-tuned leaves tiered on for the same reason
# the other way round. Results: results/2026-09-24-cal-j-arm-{h10,tiered}/.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aad

resources:
  - ../../base

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: java
        namespace: aad
      spec:
        template:
          spec:
            nodeSelector:
              aad/cell: arm-tuned
            containers:
              - name: java
                env:
                  - name: JAVA_TOOL_OPTIONS
                    value: "-Xms24g -Xmx24g -XX:+UseTransparentHugePages -XX:-TieredCompilation -XX:ReservedCodeCacheSize=64M -XX:InitialCodeCacheSize=64M"
