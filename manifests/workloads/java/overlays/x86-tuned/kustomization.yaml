# Tuned cell: THP for heap and code cache, tiered compilation LEFT ON (the JVM
# default). "Tuned" is the best flag set measured on each chip, not one bundle:
# on calibration day 2026-09-24 (n=1, Java ladder, p99 < 10 ms) this Xeon 6 node
# reached 50k rps with tiered on vs 40k with the CMP333 bundle
# (-XX:-TieredCompilation + 64M code cache, still used on arm-tuned, where it
# measured 80k vs 70k). Results: results/2026-09-24-cal-j-x86-{h10,tiered}/.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aad

resources:
  - ../../base

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: java
        namespace: aad
      spec:
        template:
          spec:
            nodeSelector:
              aad/cell: x86-tuned
            containers:
              - name: java
                env:
                  - name: JAVA_TOOL_OPTIONS
                    value: "-Xms24g -Xmx24g -XX:+UseTransparentHugePages"
