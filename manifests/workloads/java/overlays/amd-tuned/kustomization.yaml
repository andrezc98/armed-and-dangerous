# Tuned AMD: THP + the CMP333 bundle (-XX:-TieredCompilation, 64M code cache),
# the same set as arm-tuned. "Tuned" is the best measured per chip; AMD
# calibration 2026-09-25 (n=1, p99 < 10 ms): both variants knee at 90k rps, and
# the bundle reads lower p99 at every high step (80k: 4.37 vs 5.10 ms; 90k: 7.00
# vs 8.98 ms). Results: results/2026-09-25-cal-j-amd-{tuned,cmp333}/.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aad

resources:
  - ../../base

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: java
        namespace: aad
      spec:
        template:
          spec:
            nodeSelector:
              aad/cell: amd-tuned
            containers:
              - name: java
                env:
                  - name: JAVA_TOOL_OPTIONS
                    value: "-Xms24g -Xmx24g -XX:+UseTransparentHugePages -XX:-TieredCompilation -XX:ReservedCodeCacheSize=64M -XX:InitialCodeCacheSize=64M" # calibrate on the AMD calibration run
