apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aad

resources:
  - deployment.yaml
  - service.yaml

# The two client Jobs are templates the runner renders (__CELL__) and applies one
# at a time, so they are not listed here.
#
# No images: transformer either. The own image is named bare with a sentinel tag
# (aad-iperf3:UNSET); the runner adds the registry and the tag (runner/README.md).
