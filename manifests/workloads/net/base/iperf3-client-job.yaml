# iperf3 client, SUT to SUT, forward direction. Template applied by the runner;
# it is not part of the kustomization because the client must start after the
# server is ready and because the two directions run one at a time.
#
#   __NAME__  unique Job name per invocation (for example iperf3-fwd-arm-tuned-r2).
#             A Job's pod template is immutable, so re-applying the same name
#             fails instead of starting the next repetition.
#   __CELL__  the cell being measured; both sides land on its node group, and it
#             labels the Job so the runner can drop every Job of the cell at the
#             end of it. For net and mongo the cell name and the node group name
#             are the same string (runner/config.py CELL_MNG).
#
# -P 8 -t 60 -J: eight parallel streams (the image ships iperf3 3.20, where -P
# spawns one thread per stream), sixty seconds, JSON on stdout for the runner.
apiVersion: batch/v1
kind: Job
metadata:
  name: __NAME__
  namespace: aad
  labels:
    aad/cell: __CELL__
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: iperf3-client
    spec:
      restartPolicy: Never
      nodeSelector:
        aad/cell: __CELL__
      tolerations:
        - key: aad/sut
          operator: Equal
          value: "true"
          effect: NoSchedule
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: iperf3-server
              topologyKey: kubernetes.io/hostname
      containers:
        - name: iperf3
          image: aad-iperf3:UNSET
          args:
            - -c
            - iperf3-server.aad.svc
            - -P
            - "8"
            - -t
            - "60"
            - -J
          resources:
            # Requests only: a throttled generator would understate the SUT.
            requests:
              cpu: "8"
              memory: 2Gi
