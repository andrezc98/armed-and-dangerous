# AMD column (m8a.4xlarge, 16 cores, no SMT), mirrors x86-stock.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aad

resources:
  - ../../base

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: iperf3-server
        namespace: aad
      spec:
        template:
          spec:
            nodeSelector:
              aad/cell: amd-stock
