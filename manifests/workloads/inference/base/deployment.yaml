# llama.cpp server on CPU, Llama 3.1 8B Instruct Q4_0.
#
# Image ghcr.io/ggml-org/llama.cpp:server-b10775 - present on GHCR and multi-arch
# (linux/amd64, linux/arm64, linux/s390x), checked through the registry API
# 2026-09-04; the newest server-b* today is server-b10795, and the older tag is
# kept because it is the one the repo already records. The image's ENTRYPOINT is
# /app/llama-server (.devops/cpu.Dockerfile, "FROM base AS server ... ENTRYPOINT
# [ \"/app/llama-server\" ]"), so args below are flags, not a command line.
#
# Flags verified against llama.cpp's tools/server/README.md (2026-09-04):
#   -m, --model FNAME          model path to load
#   --host HOST                ip address to listen (image already sets
#                              LLAMA_ARG_HOST=0.0.0.0; passed anyway so the
#                              manifest is the single source of truth)
#   --port PORT                port to listen (default 8080)
#   -c, --ctx-size N           size of the prompt context
#   -np, --parallel N          number of server slots
#   --metrics                  enable prometheus compatible metrics endpoint
#   -t, --threads N            added per cell by the overlays; stock cells leave
#                              the binary default so it can be read off the
#                              startup log instead of assumed (SPEC 3.5)
# GET /health returns 503 with {"error":{"code":503,"message":"Loading model"}}
# while the model loads and 200 {"status":"ok"} once it is ready, which is
# exactly a readiness probe.
#
# The GGUF is downloaded once per pod into an emptyDir instead of baked into an
# image: 4.4 GiB of weights do not belong in a registry we push to, and the
# checksum below makes the download reproducible. Weights are
# unsloth/Llama-3.1-8B-Instruct-GGUF, Llama 3.1 Community License, ungated;
# size 4675896704 bytes and sha256
# 88e2c6002459f892d77c7e5e219868ef08a57c4e92354c7271aaf64f47ab0eaa confirmed
# 2026-09-04 from the x-linked-size / x-linked-etag headers Hugging Face returns
# for that path.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama
  namespace: aad
  labels:
    app: llama
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llama
  template:
    metadata:
      labels:
        app: llama
    spec:
      tolerations:
        - key: aad/sut
          operator: Equal
          value: "true"
          effect: NoSchedule
      initContainers:
        - name: fetch-model
          # curlimages/curl 8.22.0, 2026-09-02, amd64 + arm64 on Docker Hub
          # (verified 2026-09-04). Alpine based, so sha256sum is in the image.
          image: curlimages/curl:8.22.0
          securityContext:
            # The image runs as uid 100; root avoids depending on the emptyDir's
            # default mode to be able to write into /models.
            runAsUser: 0
          env:
            - name: MODEL_FILE
              value: Llama-3.1-8B-Instruct-Q4_0.gguf
            - name: MODEL_URL
              value: https://huggingface.co/unsloth/Llama-3.1-8B-Instruct-GGUF/resolve/main/Llama-3.1-8B-Instruct-Q4_0.gguf
            - name: MODEL_SHA256
              value: 88e2c6002459f892d77c7e5e219868ef08a57c4e92354c7271aaf64f47ab0eaa
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              cd /models
              curl -fsSL --retry 3 -o "${MODEL_FILE}" "${MODEL_URL}"
              echo "${MODEL_SHA256}  ${MODEL_FILE}" | sha256sum -c -
          resources:
            # requests = limits here too, and not because this container needs
            # the guarantee: QoS is computed over the app containers AND the init
            # containers ("allContainers = append(allContainers,
            # pod.Spec.Containers...); allContainers = append(allContainers,
            # pod.Spec.InitContainers...)", kubernetes release-1.36
            # pkg/apis/core/v1/helper/qos/qos.go). One init container without
            # limits makes the whole pod Burstable, and the static CPU manager
            # skips it - "Exclusive CPU allocation skipped, pod QoS is not
            # guaranteed" (pkg/kubelet/cm/cpumanager/policy_static.go). The
            # inference cells would have been the only ones without exclusive
            # CPUs, which is exactly the bias the control exists to remove.
            #
            # 500m on purpose: a fractional request keeps this container in the
            # shared pool (the download is network bound) while the llama
            # container below still gets its 15 exclusive vCPUs. Pod scheduling
            # is unaffected - the effective pod request is max(init, sum(app)).
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - name: models
              mountPath: /models
      containers:
        - name: llama
          image: ghcr.io/ggml-org/llama.cpp:server-b10775
          args:
            - -m
            - /models/Llama-3.1-8B-Instruct-Q4_0.gguf
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - -c
            - "8192"
            - -np
            - "4"
            - --metrics
          ports:
            - name: http
              containerPort: 8080
          resources:
            # ephemeral-storage matches the emptyDir sizeLimit: the 4.4 GiB GGUF
            # lands on the node's data volume, and a node too small for it should
            # leave the pod Pending at scheduling time instead of evicting it
            # halfway through a measured run.
            requests:
              cpu: "15"
              memory: 48Gi
              ephemeral-storage: 8Gi
            limits:
              cpu: "15"
              memory: 48Gi
              ephemeral-storage: 8Gi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 60
          volumeMounts:
            - name: models
              mountPath: /models
      volumes:
        - name: models
          emptyDir:
            sizeLimit: 8Gi
