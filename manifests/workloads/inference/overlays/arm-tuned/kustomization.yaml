# Tuned Graviton: one thread per exclusive vCPU. m9g.4xlarge has 16 physical
# cores and no SMT, but the pod only owns 15 of them: with the static CPU manager
# policy (infra/userdata/base.toml) the 16th is the reserved vCPU where the
# DaemonSets live. -t 16 would have put one llama.cpp thread on a core the pod
# does not own, which is self-oversubscription, not tuning (fixed 2026-09-04).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aad

resources:
  - ../../base

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: llama
        namespace: aad
      spec:
        template:
          spec:
            nodeSelector:
              aad/cell: arm-tuned
  # Append -t instead of restating the whole args list, so a change to the base
  # flags does not have to be made five times.
  - target:
      kind: Deployment
      name: llama
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: "-t"
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: "15"
