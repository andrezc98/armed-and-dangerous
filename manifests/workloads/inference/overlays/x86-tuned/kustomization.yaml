# Tuned x86: one thread per physical core. m8i.4xlarge is 8 cores with SMT.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aad

resources:
  - ../../base

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: llama
        namespace: aad
      spec:
        template:
          spec:
            nodeSelector:
              aad/cell: x86-tuned
  # Append -t instead of restating the whole args list, so a change to the base
  # flags does not have to be made five times.
  - target:
      kind: Deployment
      name: llama
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: "-t"
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: "8"
