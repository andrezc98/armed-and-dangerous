# Tuned x86: 15 threads = the pod's 15 exclusive vCPUs (static CPU manager, the
# 16th is reserved), i.e. SMT siblings included. Calibration day 2026-09-24:
# 57.5 tok/s with -t 15 vs 40.6 with one thread per physical core (-t 8, now
# the x86-t8 cell); "tuned" is the best measured on each chip.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aad

resources:
  - ../../base

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: llama
        namespace: aad
      spec:
        template:
          spec:
            nodeSelector:
              aad/cell: x86-tuned
  # Append -t instead of restating the whole args list, so a change to the base
  # flags does not have to be made five times.
  - target:
      kind: Deployment
      name: llama
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: "-t"
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: "15"
