# Same node group as x86-tuned (nodeSelector aad/cell: x86-tuned), 8 threads:
# one per PHYSICAL core of the m8i.4xlarge (8 cores with SMT), the usual advice
# for llama.cpp on x86. Until 2026-09-24 this was the tuned setting; on
# calibration day it measured 40.6 tok/s against 57.5 with 15 threads (SMT
# siblings included, +42 %), so x86-tuned moved to -t 15 ("tuned" = best
# measured per chip) and this cell keeps the advice that did not hold.
# Results: results/2026-09-24-cal-llama-{x86,x86t15}/. This is a cell of the
# inference workload, not a node group.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aad

resources:
  - ../../base

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: llama
        namespace: aad
      spec:
        template:
          spec:
            nodeSelector:
              aad/cell: x86-tuned
  # Append -t instead of restating the whole args list, so a change to the base
  # flags does not have to be made five times.
  - target:
      kind: Deployment
      name: llama
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: "-t"
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: "8"
