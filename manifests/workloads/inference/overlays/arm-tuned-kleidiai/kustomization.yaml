# arm-tuned with llama.cpp built with Arm KleidiAI (apps/llama/build-kleidiai.sh:
# the same pinned b10775 and the official cpu.Dockerfile, plus
# -DGGML_CPU_KLEIDIAI=ON). The official image carries AMX on x86 but no KleidiAI
# on arm64 (calibration day 2026-09-24 system_info); this cell measures what
# that costs Graviton. Same node group, threads and flags as arm-tuned.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aad

resources:
  - ../arm-tuned

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: llama
        namespace: aad
      spec:
        template:
          spec:
            containers:
              - name: llama
                image: aad-llama:UNSET
