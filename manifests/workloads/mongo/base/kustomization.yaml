apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aad

resources:
  - statefulset.yaml
  - service.yaml

# ycsb-load-job.yaml and ycsb-run-job.yaml are NOT listed: applying an overlay
# would start the load and the measured run at the same time as the database.
# The runner substitutes their placeholders and applies them itself, in order.
