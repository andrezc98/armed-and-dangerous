# One-shot load of the YCSB dataset. Runs on the loader node group, never on a
# SUT: the point is to measure the database, not the generator.
#
# 20M records is about 20 GB, which fits the 40 GB WiredTiger cache (SPEC 4).
# The image entrypoint is go-ycsb, so args start at the subcommand, and
# /workloads ships inside the image (apps/ycsb/Dockerfile).
#
# Applied by the runner, not by kustomize, so no kustomization images:
# transformer ever sees it: the runner puts the registry and the tag on the own
# image (aad-ycsb:UNSET) itself, the same pass that fills the placeholder below.
#
#   __NAME__  unique Job name per invocation, rendered by the runner
#             (for example ycsb-load-2026-09-11).
#
# The name is a placeholder because a Job's pod template is immutable: re-applying
# a Job whose name already exists fails with "field is immutable" instead of
# starting a new run. One name per invocation is the only thing that makes the
# template re-appliable.
apiVersion: batch/v1
kind: Job
metadata:
  name: __NAME__
  namespace: aad
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: ycsb-load
    spec:
      restartPolicy: Never
      nodeSelector:
        aad/role: loader
      containers:
        - name: ycsb
          image: aad-ycsb:UNSET
          args:
            - load
            - mongodb
            - -P
            - /workloads/workloada
            - -p
            - mongodb.url=mongodb://mongo.aad.svc:27017/ycsb?w=1
            - -p
            - recordcount=20000000
            - --threads
            - "64"
          resources:
            # Requests only, no limits: a throttled load generator would make the
            # database look faster than it is. The loader node is dedicated and
            # its own CPU is the run guard (SPEC 3).
            requests:
              cpu: "8"
              memory: 4Gi
