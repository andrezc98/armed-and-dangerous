apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aad

resources:
  - ../../base

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: mongo
        namespace: aad
      spec:
        template:
          spec:
            nodeSelector:
              aad/cell: x86-stock
