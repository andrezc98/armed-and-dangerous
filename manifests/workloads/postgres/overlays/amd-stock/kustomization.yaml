# Stock: the server's defaults (base), on the amd-stock node group.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aad

resources:
  - ../../base

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: postgres
        namespace: aad
      spec:
        template:
          spec:
            nodeSelector:
              aad/cell: amd-stock
