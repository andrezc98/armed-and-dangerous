# One pgbench process of a knee step, a warm-up pass or a fixed run
# (runner/cell.py run_pgbench applies pgbench_clients of these together).
#
#   __NAME__           unique Job name per invocation
#   __CELL__           the cell; labels the Job so the cell drops its Jobs at the end
#   __CLIENTS__        -c, this process's share of the step's sessions
#   __THREADS__        -j, and the vCPUs the Job requests (never more threads
#                      than the CPUs it asked for)
#   __SECONDS__        -T
#   __RATE_ARGS__      "" (unthrottled: knee and warm-up) or "-R <tps>" (fixed
#                      run). Never "-R 0": pgbench 18.6 rejects it ("invalid rate
#                      limit", pgbench.c).
#   __SAMPLING_RATE__  --sampling-rate of the per-transaction log
#
# -S: "Run built-in select-only script. Shorthand for -b select-only"
# (https://www.postgresql.org/docs/18/pgbench.html, read 2026-09-25, as every
# flag here). pgbench prints no percentiles, so -l logs a sample of the
# transactions ("only the specified fraction of transactions are logged") into
# pgbench_log.<pid>[.<thread>] in the working directory. Once pgbench is done
# the script prints, after the marker (runner/knee.py PGBENCH_MARKER):
#   rc=<pgbench's exit code>      non-zero = no report (runner/knee.py)
#   samples=<N>                   logged transactions that did not fail
#   <count> <us> ...              histogram of the SERVICE latency: field 3
#                                 ("time") minus field 7 ("schedule_lag", present
#                                 only with --rate) = time from the actual start;
#                                 without -R field 3 already is that
#   ---AAD-PGBENCH-LAG-US---      then the histogram of field 7 alone (empty
#                                 without -R): how far behind schedule the
#                                 generator started, judged on its own
# Under -R pgbench counts "time" from the scheduled start, so it carries the
# generator's own lag (docs, -R); the SLO is about the server, the lag is
# about the generator, and the fixed run judges each on its own. "failed"
# rows are dropped (counted in the summary). Histograms, not the raw log,
# reach `kubectl logs`: a few thousand lines instead of hundreds of
# thousands. awk, sort and uniq are in the image (docker run postgres:18.6,
# 2026-09-25). No $(...) anywhere: Kubernetes expands $(NAME) in args.
apiVersion: batch/v1
kind: Job
metadata:
  name: __NAME__
  namespace: aad
  labels:
    aad/cell: __CELL__
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: pgbench-run
    spec:
      restartPolicy: Never
      nodeSelector:
        aad/role: loader
      containers:
        - name: pgbench
          image: postgres:18.6
          workingDir: /tmp
          command: [sh, -c]
          args:
            - >-
              pgbench -S -c __CLIENTS__ -j __THREADS__ -T __SECONDS__ __RATE_ARGS__
              -l --sampling-rate=__SAMPLING_RATE__; rc=$?;
              echo ---AAD-PGBENCH-LATENCY-US---; echo rc=$rc;
              cat pgbench_log.* > all.log;
              awk '$3 ~ /^[0-9]+$/ {print (NF >= 7 ? $3 - $7 : $3)}' all.log > service.txt;
              awk 'END {print "samples=" NR}' service.txt;
              sort -n service.txt | uniq -c;
              echo ---AAD-PGBENCH-LAG-US---;
              awk '$3 ~ /^[0-9]+$/ && NF >= 7 {print $7}' all.log | sort -n | uniq -c;
              exit $rc
          env:
            - name: PGHOST
              value: postgres.aad.svc
            - name: PGUSER
              value: postgres
          # Requests only, no limits, like the go-ycsb Jobs: a throttled
          # generator would make the database look faster than it is.
          resources:
            requests:
              cpu: "__THREADS__"
              memory: 2Gi
