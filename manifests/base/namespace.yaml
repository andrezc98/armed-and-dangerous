# Everything in this lab lives in one namespace. Pod Security Admission is
# enforced by default from Kubernetes 1.25 on, and the three DaemonSets here are
# privileged on purpose (hostPID, hostPath into /proc, /sys and /dev, privileged
# containers), so the namespace opts into the privileged profile explicitly
# instead of failing at admission time.
# Labels per https://kubernetes.io/docs/concepts/security/pod-security-admission/
# (verified 2026-09-04).
apiVersion: v1
kind: Namespace
metadata:
  name: aad
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
